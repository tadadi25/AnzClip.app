<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AnzClip - Player Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* bottom-nav clearance: height + iOS home-indicator inset */
    --nav-h:64px;
    --nav-safe:env(safe-area-inset-bottom, 0px);
    --nav-total:calc(var(--nav-h) + var(--nav-safe));
    --bg:#0B0D09;
    --surface:#181B14;
    --surface-2:#22261A;
    --surface-3:#2C3122;
    --chalk:#F4F7EE;
    --chalk-dim:#B9C2AC;
    --muted:#7E8A73;
    --coral:#C6FF4D;
    --coral-dim:#A8E63D;
    --gold:#E9C46A;
    --line-glow: 0 0 12px rgba(198,255,77,.25);
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(198,255,77,.08), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 42px),
      var(--bg);
    color:var(--chalk);
    font-family:'Heebo', sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:480px; min-height:100vh;
    background:transparent;
    display:flex; flex-direction:column;
    position:relative;
    padding-bottom:calc(var(--nav-total) + 12px);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Rubik', sans-serif;}

  /* top bar */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(11,13,9,.88); backdrop-filter:blur(8px);
    padding:16px 18px 12px;
    border-bottom:1px solid rgba(243,241,231,.08);
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-mark{
    width:32px;height:32px; object-fit:contain; display:block;
  }
  .brand-name{font-family:'Rubik';font-weight:800;font-size:17px;letter-spacing:.2px;}
  .back-btn{
    background:none;border:none;color:var(--chalk-dim);
    font-family:'Heebo';font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:6px;padding:6px 2px;
  }
  .floating-lang-toggle{
    position:fixed; top:16px; inset-inline-end:16px; z-index:40;
    background:var(--surface); border:1px solid rgba(243,241,231,.12); border-radius:100px;
    color:var(--chalk-dim); font-family:'Heebo'; font-weight:700; font-size:12.5px;
    display:flex; align-items:center; gap:6px; padding:8px 13px; cursor:pointer;
  }
  .chalk-line{
    height:2px; margin-top:12px; border-radius:2px;
    background:linear-gradient(90deg, var(--chalk) 0%, var(--chalk) var(--fill,100%), rgba(243,241,231,.12) var(--fill,100%));
    box-shadow:var(--line-glow);
  }
  .role-toggle{
    display:flex; gap:4px; background:var(--surface-2); border-radius:100px; padding:3px; margin-top:12px;
  }
  .role-btn{
    flex:1; border:none; background:none; cursor:pointer; padding:8px 10px; border-radius:100px;
    font-family:'Heebo'; font-weight:600; font-size:12.5px; color:var(--muted); transition:all .15s;
  }
  .role-btn.active{background:var(--coral); color:#1a0f0a;}
  .coach-identity{
    display:flex; align-items:center; gap:10px; margin-bottom:18px; background:var(--surface);
    border:1px solid rgba(243,241,231,.08); border-radius:14px; padding:12px 14px;
  }
  .coach-identity select{
    flex:1; background:none; border:none; color:var(--chalk); font-family:'Heebo'; font-weight:600; font-size:14px;
  }
  .coach-identity select:focus{outline:none;}
  .score-input-row{display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:14px; padding:14px; margin-bottom:4px;}
  .score-input-row input[type="range"]{flex:1; accent-color:var(--coral);}
  .score-input-row b{font-family:'IBM Plex Mono'; font-size:20px; color:var(--gold); min-width:44px; text-align:center;}

  main{flex:1; padding:20px 18px 10px;}

  /* HERO */
  .hero{position:relative; padding:26px 4px 18px; overflow:hidden;}
  .hero-num{
    position:absolute; left:-10px; top:-38px;
    font-family:'Rubik'; font-weight:900; font-size:190px; line-height:1;
    color:rgba(243,241,231,.045);
    user-select:none; pointer-events:none;
  }
  .eyebrow{
    font-family:'IBM Plex Mono'; font-size:11.5px; letter-spacing:1.5px;
    color:var(--coral-dim); text-transform:uppercase; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:''; width:16px;height:2px;background:var(--coral); display:inline-block;}
  h1.hero-title{
    font-family:'Rubik'; font-weight:900; font-size:34px; line-height:1.15;
    margin:0 0 14px; position:relative; z-index:1;
  }
  .hero-sub{color:var(--chalk-dim); font-size:15px; line-height:1.6; margin:0 0 22px; position:relative; z-index:1; max-width:38ch;}
  .btn{
    border:none; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:15.5px;
    border-radius:14px; padding:15px 22px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--coral); color:#1a0f0a; box-shadow:0 10px 24px -8px rgba(198,255,77,.55);}
  .btn-primary:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:var(--surface-2); color:var(--chalk); border:1px solid rgba(243,241,231,.1);}
  .btn-block{width:100%;}

  .stats-strip{display:flex; gap:10px; margin-top:26px;}
  .hero-cta-row{display:flex; gap:10px; flex-wrap:wrap;}
  .hero-cta-row .btn{flex:1; min-width:150px;}
  .btn-ghost-line{background:none; color:var(--chalk); border:1.5px solid rgba(243,241,231,.2);}

  .icon-stats-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .icon-stats-row::-webkit-scrollbar{display:none;}
  .icon-stat-card{
    flex:0 0 auto; min-width:104px; background:var(--surface); border:1px solid rgba(243,241,231,.08);
    border-radius:var(--radius); padding:16px 14px; display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center; color:var(--coral);
  }
  .icon-stat-card b{font-family:'Rubik'; font-weight:800; font-size:20px; color:var(--chalk);}
  .icon-stat-card span{font-size:11.5px; color:var(--muted);}

  .coaches-row{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; align-items:stretch;}
  .coaches-row::-webkit-scrollbar{display:none;}
  .coach-mini-card{
    flex:0 0 auto; width:140px; background:var(--surface); border:1px solid rgba(243,241,231,.08);
    border-radius:var(--radius); padding:14px 12px; display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  /* every card is the same height whatever the name or badge says:
     the name is clamped to two lines and the button is pinned to the bottom */
  .coach-mini-card .coach-name{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; line-height:1.3; min-height:2.6em; width:100%;
  }
  .coach-mini-card .badge{ min-height:22px; display:inline-flex; align-items:center; }
  .coach-mini-card .rating{ min-height:20px; margin-bottom:10px; }
  .coach-mini-card .select-btn{ margin-top:auto; }

  .clips-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* video call */
  .video-call-wrap{
    position:fixed; inset:0; background:#000; z-index:100;
    display:flex; align-items:center; justify-content:center;
  }
  #remote-video{width:100%; height:100%; object-fit:cover; background:#111;}
  #local-video{
    position:absolute; width:110px; height:150px; object-fit:cover; border-radius:12px;
    bottom:110px; inset-inline-end:16px; border:2px solid rgba(255,255,255,.3); background:#222;
  }
  .call-timer{
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); color:#fff; padding:7px 16px; border-radius:100px; font-size:14px;
  }
  .call-status{
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.75); font-size:13px; font-family:'Heebo';
  }
  .call-controls{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; gap:16px; align-items:flex-start;
  }
  .call-ctl{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .call-ctl-label{
    font-family:'Heebo'; font-size:11px; font-weight:500; color:rgba(255,255,255,.88);
    text-shadow:0 1px 4px rgba(0,0,0,.7); white-space:nowrap; text-align:center;
  }
  .call-btn{
    width:52px; height:52px; border-radius:50%; border:none; background:rgba(255,255,255,.15);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:'IBM Plex Mono'; font-size:13px; font-weight:700;
  }
  .call-btn.muted, .call-btn.cam-off{ background:var(--coral); color:#1a0f0a; }
  .call-btn-extend{ background:var(--gold); color:#1a0f0a; }
  .call-btn-end{ background:#ff3b30; }
  .call-btn.recording{ background:#ff3b30; color:#fff; }
  /* desktop: the call lives in a floating window, not the whole screen */
  @media (min-width: 900px){
    .video-call-wrap{
      inset:auto; top:50%; left:50%; transform:translate(-50%, -50%);
      width:min(920px, 78vw); height:min(600px, 76vh);
      border-radius:18px; overflow:hidden;
      border:1px solid rgba(243,241,231,.14);
      box-shadow:0 30px 90px rgba(0,0,0,.65);
    }
    .video-call-wrap::before{
      content:''; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:-1;
    }
    #local-video{ width:96px; height:128px; bottom:96px; }
    .call-controls{ bottom:20px; gap:12px; }
    .call-btn{ width:46px; height:46px; }
  }
  .recording-indicator{
    position:absolute; top:60px; inset-inline-start:16px;
    background:rgba(255,59,48,.9); color:#fff; font-family:'Heebo'; font-weight:700; font-size:12px;
    padding:5px 12px; border-radius:100px; display:flex; align-items:center; gap:6px;
  }
  .share-menu-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .share-menu-sheet{
    width:100%; max-width:480px; background:var(--surface); border-radius:22px 22px 0 0;
    padding:20px 20px 28px; max-height:80vh; overflow-y:auto;
  }
  .share-menu-title{ font-family:'Rubik'; font-weight:700; font-size:16px; margin-bottom:14px; text-align:center; }
  .share-menu-preview{ width:100%; max-height:260px; object-fit:contain; border-radius:14px; margin-bottom:16px; background:#000; }
  .share-menu-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:18px; }
  .share-menu-item{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px;
    background:var(--surface-2); border-radius:14px; text-decoration:none; color:var(--chalk);
    font-family:'Heebo'; font-size:12px; font-weight:600; text-align:center;
  }
  .share-menu-dot{ width:34px; height:34px; border-radius:50%; background:var(--pcolor,#0B6E4F); display:block; }
  .share-menu-close{
    width:100%; background:none; border:1.5px solid rgba(243,241,231,.15); color:var(--chalk-dim);
    font-family:'Heebo'; font-weight:700; font-size:14px; padding:12px; border-radius:12px; cursor:pointer;
  }
  .clip-thumb-card{position:relative; border-radius:14px; overflow:hidden; background:#000; aspect-ratio:1/1; cursor:pointer;}
  .clip-thumb-card video{width:100%; height:100%; object-fit:cover; display:block;}
  .clip-thumb-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.25); color:#fff; pointer-events:none;
  }
  .clip-thumb-meta{position:absolute; bottom:0; inset-inline:0; padding:8px 10px; background:linear-gradient(0deg, rgba(0,0,0,.75), transparent); color:#fff;}
  .clip-thumb-meta b{display:block; font-size:12px;}
  .clip-thumb-meta span{font-size:10px; opacity:.8;}
  .stat-chip{
    flex:1; background:var(--surface); border:1px solid rgba(243,241,231,.07);
    border-radius:14px; padding:12px 10px; text-align:center;
  }
  .stat-chip b{display:block; font-family:'IBM Plex Mono'; font-size:20px; color:var(--gold);}
  .stat-chip span{font-size:11px; color:var(--muted);}

  .section-title{
    font-family:'Rubik'; font-weight:800; font-size:13px; letter-spacing:.5px;
    color:var(--chalk-dim); text-transform:uppercase; margin:30px 0 4px;
  }
  .section-line{height:2px; width:34px; background:var(--chalk); opacity:.5; margin-bottom:16px; border-radius:2px;}

  .step-row{display:flex; gap:14px; margin-bottom:16px; align-items:flex-start;}
  .step-num{
    font-family:'IBM Plex Mono'; font-weight:600; font-size:13px; color:#0e1d16;
    background:var(--chalk); width:26px;height:26px;min-width:26px; border-radius:50%;
    display:flex;align-items:center;justify-content:center; margin-top:1px;
  }
  .step-text b{display:block; font-size:14.5px; margin-bottom:2px;}
  .step-text span{font-size:13px; color:var(--muted); line-height:1.5;}

  /* upload */
  .dropzone{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    border:2px dashed rgba(243,241,231,.22); border-radius:var(--radius);
    padding:34px 18px; text-align:center; cursor:pointer;
    background:var(--surface); transition:border-color .15s, background .15s;
  }
  .dropzone:hover{border-color:var(--coral); background:var(--surface-2);}
  .dropzone svg{margin-bottom:10px; flex-shrink:0;}
  .dropzone b{display:block; font-size:15px; margin-bottom:4px; width:100%;}
  .dropzone span{font-size:12.5px; color:var(--muted); width:100%;}
  .video-preview{border-radius:var(--radius); overflow:hidden; background:#000; position:relative;}
  .video-preview video{width:100%; display:block; max-height:280px; background:#000;}
  .file-pill{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border-radius:12px; padding:10px 14px; margin-top:10px;
    font-size:13px; color:var(--chalk-dim);
  }
  .file-pill button{background:none; border:none; color:var(--coral-dim); font-size:12.5px; cursor:pointer; font-family:'Heebo'; font-weight:600;}

  .field-label{font-size:13px; font-weight:600; color:var(--chalk-dim); margin:20px 0 8px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:9px 16px; border-radius:100px; font-size:13.5px; cursor:pointer; white-space:nowrap;
    background:var(--surface); border:1px solid rgba(243,241,231,.12); color:var(--chalk-dim);
    transition:all .15s;
  }
  .chip.active{background:var(--coral); border-color:var(--coral); color:#1a0f0a; font-weight:700;}
  textarea{
    width:100%; background:var(--surface); border:1px solid rgba(243,241,231,.12); border-radius:14px;
    color:var(--chalk); font-family:'Heebo'; font-size:14px; padding:12px 14px; resize:none; min-height:76px;
  }
  textarea.textarea-lg{min-height:340px; line-height:1.7; max-height:none;}
  textarea:focus, input:focus{outline:2px solid var(--coral-dim); outline-offset:1px;}

  .sticky-cta{
    position:sticky; bottom:var(--nav-total); padding:14px 0 6px; margin-top:18px;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .upload-progress-track{
    height:6px; border-radius:6px; background:var(--surface-2); margin-top:12px; overflow:hidden;
  }
  .upload-progress-fill{
    height:100%; width:0%; background:var(--coral); border-radius:6px; transition:width .2s ease;
  }
  .attach-dropzone{
    border:1.5px dashed rgba(243,241,231,.2); border-radius:14px; padding:16px; text-align:center;
    cursor:pointer; background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:6px;
    color:var(--muted); transition:border-color .15s, background .15s;
  }
  .attach-dropzone:hover{border-color:var(--coral); background:var(--surface-2);}
  .attach-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .attach-chip{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid rgba(243,241,231,.08);
    border-radius:12px; padding:9px 12px; font-size:13px;
  }
  .attach-chip .attach-icon{color:var(--coral-dim); flex-shrink:0; display:flex;}
  .attach-chip .attach-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-chip button{background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0; display:flex;}
  .attach-chip img.attach-thumb{width:32px; height:32px; border-radius:6px; object-fit:cover; flex-shrink:0;}
  .attach-view-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .attach-view-item{
    display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:12px;
    padding:9px 12px; font-size:13px; text-decoration:none; color:var(--chalk);
  }
  .attach-view-item img{width:32px; height:32px; border-radius:6px; object-fit:cover;}

  /* filter bar */
  .filter-bar{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px;}
  .filter-bar::-webkit-scrollbar{display:none;}
  select.sort-select{
    background:var(--surface); color:var(--chalk); border:1px solid rgba(243,241,231,.14);
    border-radius:100px; padding:9px 14px; font-family:'Heebo'; font-size:13px; white-space:nowrap;
  }

  /* coach card */
  .coach-card{
    background:var(--surface); border:1px solid rgba(243,241,231,.08); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .coach-card:hover{border-color:rgba(198,255,77,.4);}
  .coach-card:active{transform:scale(.99);}
  .coach-top{display:flex; gap:12px; align-items:center;}
  .avatar{
    width:48px;height:48px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    font-family:'Rubik'; font-weight:800; font-size:16px; color:#0e1d16; flex-shrink:0;
  }
  .coach-name-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
  .coach-name{font-family:'Rubik'; font-weight:700; font-size:15.5px;}
  .rating{font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--gold); display:flex; align-items:center; gap:3px;}
  .coach-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; margin:11px 0;}
  .badge{
    font-size:11px; padding:4px 10px; border-radius:100px; background:var(--surface-2); color:var(--chalk-dim);
    border:1px solid rgba(243,241,231,.08);
  }
  .badge.spec{background:rgba(198,255,77,.12); color:var(--coral-dim); border-color:rgba(198,255,77,.25);}
  .coach-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px dashed rgba(243,241,231,.1);}
  .price-block .price{font-family:'IBM Plex Mono'; font-weight:600; font-size:19px; color:var(--chalk);}
  .price-block .turnaround{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .select-btn{
    background:transparent; border:1.5px solid var(--coral); color:var(--coral-dim);
    font-family:'Heebo'; font-weight:700; font-size:13px; padding:9px 16px; border-radius:11px; cursor:pointer;
  }

  /* confirm screen */
  .summary-card{background:var(--surface); border-radius:var(--radius); padding:18px; border:1px solid rgba(243,241,231,.08);}
  .summary-row{display:flex; justify-content:space-between; padding:10px 0; font-size:14px; border-bottom:1px solid rgba(243,241,231,.06);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--muted);}
  .summary-row span:last-child{font-weight:600; text-align:end;}
  .commit-box{
    margin-top:16px; padding:14px; border-radius:14px; background:rgba(233,196,106,.08);
    border:1px solid rgba(233,196,106,.25); font-size:13px; color:var(--gold); display:flex; gap:10px; align-items:flex-start;
  }

  /* requests */
  .req-card{background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid rgba(243,241,231,.08);}
  .req-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .req-meta{font-size:12px; color:var(--muted);}
  .status-badge{font-size:11.5px; padding:5px 11px; border-radius:100px; font-weight:700; white-space:nowrap;}

function currentSport(){
  // a logged-in account is bound to its own sport; accounts created before the
  // basketball launch have no sport field and are football by definition.
  if(state.user) return state.user.sport || 'football';
  if(state.signupDraft && state.signupDraft.sport) return state.signupDraft.sport;
  return state.sport || 'football';
}
function sportData(sport){ return SPORT_DATA[sport || currentSport()] || SPORT_DATA.football; }
function sportOf(u){ return (u && u.sport) || 'football'; }
function sportPositions(sport){ return Object.keys(sportData(sport).positions.he); }
function sportFieldPositions(sport){ return sportData(sport).fieldPositions; }
function sportCoachTypes(sport){ return Object.keys(sportData(sport).coachTypes.he); }
function sportGeneralSpecs(sport){ return Object.keys(sportData(sport).generalSpec.he); }
function sportHasGoalkeeper(sport){ return !!sportData(sport).statDefs.goalkeeper; }
function sportLabel(sport){ return (SPORT_LABEL[state.lang] || SPORT_LABEL.he)[sport || currentSport()]; }

// Labels resolve against the active sport and fall back to the other sport, so a
// record created in the other discipline never renders as a blank label.
function sportLabelMap(kind, lang){
  const primary = (sportData()[kind] || {})[lang] || {};
  return new Proxy({}, { get:(_, key)=>{
    if(primary[key]!=null) return primary[key];
    for(const sp of SPORTS){
      const m = (SPORT_DATA[sp][kind] || {})[lang];
      if(m && m[key]!=null) return m[key];
    }
    return String(key);
  }});
}
const POSITION_LABEL = new Proxy({}, { get:(_, lang)=> sportLabelMap('positions', lang) });
const COACH_TYPE_LABEL = new Proxy({}, { get:(_, lang)=> sportLabelMap('coachTypes', lang) });
const GENERAL_SPEC_LABEL = new Proxy({}, { get:(_, lang)=> sportLabelMap('generalSpec', lang) });
const STAT_CATEGORY_LABEL = new Proxy({}, { get:(_, lang)=> sportLabelMap('statCategories', lang) });
const STAT_DEFS = new Proxy({}, { get:(_, role)=>{
  const d = sportData().statDefs;
  return d[role] || d.field;
}});
function combinedStatDefs(){
  const d = sportData().statDefs;
  const out = [];
  if(d.goalkeeper) out.push(...d.goalkeeper.map(s=>({ ...s, role:'goalkeeper', id:'goalkeeper:'+s.key })));
  out.push(...d.field.map(s=>({ ...s, role:'field', id:'field:'+s.key })));
  return out;
}
function statLabel(key, role){
  const def = (STAT_DEFS[role]||[]).find(s=>s.key===key);
  return def ? def[state.lang] : key;
}

function relevantStatDefsForPosition(position){
  if(position==='goalkeeper') return STAT_DEFS.goalkeeper.map(s=>({ ...s, role:'goalkeeper', id:'goalkeeper:'+s.key }));
  if(position) return STAT_DEFS.field.map(s=>({ ...s, role:'field', id:'field:'+s.key }));
  return combinedStatDefs();
}

// window.storage only exists inside the Claude artifact preview. When this file
// is opened directly in a regular browser (e.g. after downloading it), we fall
// back to localStorage so accounts and requests still persist.
const hasCloudStorage = (typeof window !== 'undefined') && !!window.storage;
async function storageGet(key, shared=false){
  if(hasCloudStorage){
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v!==null ? {key, value:v, shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared=false){
  if(hasCloudStorage){
    try{ return await window.storage.set(key, value, shared); }catch(e){ console.error('storage.set failed', e); return null; }
  }
  try{ localStorage.setItem(key, value); return {key, value, shared}; }
  catch(e){ console.error('localStorage.setItem failed', e); return null; }
}
async function storageDelete(key, shared=false){
  if(hasCloudStorage){
    try{ return await window.storage.delete(key, shared); }catch(e){ return null; }
  }
  try{ localStorage.removeItem(key); return {key, deleted:true, shared}; }catch(e){ return null; }
}

function uploadVideoToStorage(file, gkUid, onProgress){
  return new Promise((resolve)=>{
    try{
      const path = `videos/${gkUid}/${Date.now()}_${file.name}`;
      const ref = storage.ref().child(path);
      const task = ref.put(file);
      task.on('state_changed',
        (snapshot)=>{
          if(onProgress && snapshot.totalBytes){
            const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
            onProgress(pct);
          }
        },
        (err)=>{ console.error('video upload failed', err); resolve(null); },
        async ()=>{
          try{ resolve(await task.snapshot.ref.getDownloadURL()); }
          catch(e){ console.error('failed to get download URL', e); resolve(null); }
        }
      );
    }catch(e){ console.error('video upload failed to start', e); resolve(null); }
  });
}
function uploadFileToStorage(file, folderPath, onProgress){
  return new Promise((resolve)=>{
    try{
      const path = `${folderPath}/${Date.now()}_${file.name}`;
      const ref = storage.ref().child(path);
      const task = ref.put(file);
      task.on('state_changed',
        (snapshot)=>{
          if(onProgress && snapshot.totalBytes){
            const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
            onProgress(pct);
          }
        },
        (err)=>{ console.error('file upload failed', err); resolve(null); },
        async ()=>{
          try{ resolve(await task.snapshot.ref.getDownloadURL()); }
          catch(e){ console.error('failed to get download URL', e); resolve(null); }
        }
      );
    }catch(e){ console.error('file upload failed to start', e); resolve(null); }
  });
}

function waitForAuthUser(){
  return new Promise(resolve=>{
    const unsub = auth.onAuthStateChanged(u=>{ unsub(); resolve(u); });
  });
}
function mapAuthError(code){
  if(code==='auth/email-already-in-use') return 'emailInUse';
  if(code==='auth/invalid-email') return 'invalidEmail';
  if(code==='auth/weak-password') return 'invalidPassword';
  if(code==='auth/wrong-password' || code==='auth/user-not-found' || code==='auth/invalid-credential') return 'loginError';
  return 'saveError';
}
async function firebaseSignUp(email, password, profile){
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('users').doc(cred.user.uid).set(profile);
    try{ await cred.user.sendEmailVerification(); }catch(e){ console.error('verification email failed', e); }
    return {ok:true, uid:cred.user.uid};
  }catch(e){ console.error('signup failed', e); return {ok:false, errorKey: mapAuthError(e.code)}; }
}
async function firebaseLogin(email, password){
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const doc = await db.collection('users').doc(cred.user.uid).get();
    if(!doc.exists){
      if(email.trim().toLowerCase()===ADMIN_EMAIL.toLowerCase()){
        return {ok:true, uid:cred.user.uid, profile:{email, role:'admin'}, emailVerified: cred.user.emailVerified};
      }
      return {ok:false, errorKey:'loginError'};
    }
    return {ok:true, uid:cred.user.uid, profile:doc.data(), emailVerified: cred.user.emailVerified};
  }catch(e){ console.error('login failed', e); return {ok:false, errorKey: mapAuthError(e.code)}; }
}

async function searchPlayersByCriteria(position, statFilters){
  try{
    let players = state.allPlayers && state.allPlayers.length ? state.allPlayers : await loadAllPlayers();
    if(position){
      players = players.filter(p=> position==='goalkeeper' ? p.playerRole==='goalkeeper' : (p.positions||[]).includes(position));
    }
    if(!statFilters || !statFilters.length) return players;

    const snap = await db.collection('playerGameStats').get();
    const byPlayer = {};
    snap.forEach(doc=>{
      const d = doc.data();
      if(!d.gkUid) return;
      if(!byPlayer[d.gkUid]) byPlayer[d.gkUid] = [];
      byPlayer[d.gkUid].push({ role: d.gkPlayerRole||'field', stats: d.stats||{} });
    });

    const matchingUids = new Set();
    Object.keys(byPlayer).forEach(uid=>{
      const games = byPlayer[uid];
      const passesAll = statFilters.every(f=>{
        const def = (STAT_DEFS[f.role]||[]).find(s=>s.key===f.key);
        if(!def) return false;
        let totalMade = 0, totalAtt = 0, sum = 0, has = false;
        games.forEach(g=>{
          if(f.role && g.role!==f.role) return;
          const v = g.stats[f.key];
          if(v==null) return;
          has = true;
          if(def.type==='ratio'){
            if(v.att){ totalMade += Number(v.made)||0; totalAtt += Number(v.att)||0; }
          } else {
            sum += Number(v)||0;
          }
        });
        if(!has) return false;
        if(def.type==='ratio'){
          if(!totalAtt) return false;
          return (totalMade/totalAtt)*100 >= f.minValue;
        }
        return sum >= f.minValue;
      });
      if(passesAll) matchingUids.add(uid);
    });

    return players.filter(p=> matchingUids.has(p.uid) && p.statsPublic!==false);
  }catch(e){ console.error('advanced player search failed', e); return []; }
}

function calcAge(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr);
  if(isNaN(dob.getTime())) return null;
  const diffMs = Date.now() - dob.getTime();
  return Math.max(0, Math.floor(diffMs / (365.25*24*3600*1000)));
}
function resizeImageFile(file, maxDim=320, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image decode failed'));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- WebRTC video call ---------------- */
let __rtcPC = null, __rtcLocalStream = null, __rtcTimerInterval = null, __rtcRoomUnsub = null, __rtcCandidatesUnsub = null;
let __rtcRecorder = null, __rtcRecordedChunks = [], __rtcRecordAnimFrame = null, __rtcAudioCtx = null, __rtcIsRecording = false;
let __rtcActiveCallId = null;
async function initVideoCall(){
  const r = state.viewingCallRequest;
  if(!r || __rtcActiveCallId===r.id) return; // already running for this call, don't double-init
  __rtcActiveCallId = r.id;

  const statusEl = document.getElementById('call-status');
  const localVideo = document.getElementById('local-video');
  const remoteVideo = document.getElementById('remote-video');

  // Attach ALL button handlers immediately, before requesting camera/mic -
  // so end-call (and the other buttons, once media is ready) always respond even if getUserMedia fails.
  let micOn = true, camOn = true;
  document.getElementById('toggle-mic')?.addEventListener('click', (e)=>{
    if(!__rtcLocalStream) return;
    micOn = !micOn;
    __rtcLocalStream.getAudioTracks().forEach(tr=>tr.enabled = micOn);
    e.currentTarget.classList.toggle('muted', !micOn);
    const lbl = document.getElementById('toggle-mic-label');
    if(lbl) lbl.textContent = micOn ? t('muteBtn') : t('unmuteBtn');
  });
  document.getElementById('toggle-cam')?.addEventListener('click', (e)=>{
    if(!__rtcLocalStream) return;
    camOn = !camOn;
    __rtcLocalStream.getVideoTracks().forEach(tr=>tr.enabled = camOn);
    e.currentTarget.classList.toggle('cam-off', !camOn);
    const lbl = document.getElementById('toggle-cam-label');
    if(lbl) lbl.textContent = camOn ? t('cameraOffBtn') : t('cameraOnBtn');
  });
  document.getElementById('end-call')?.addEventListener('click', ()=>{
    if(!confirm(t('confirmEndCall'))) return;
    endVideoCall();
    go('call-request-detail');
  });
  document.getElementById('extend-call')?.addEventListener('click', async ()=>{
    const newExt = (r.extendedMinutes||0) + 15;
    await updateCallRequestDoc(r.id, { extendedMinutes: newExt });
    r.extendedMinutes = newExt;
  });
  document.getElementById('toggle-record')?.addEventListener('click', async (e)=>{
    if(!__rtcIsRecording){
      const started = startCallRecording();
      if(started){
        e.currentTarget.classList.add('recording');
        const lbl = document.getElementById('toggle-record-label');
        if(lbl) lbl.textContent = t('recordingLive');
        await updateCallRequestDoc(r.id, { isRecording:true, recordingBy: state.role }).catch(()=>{});
      }
    } else {
      stopCallRecording();
      e.currentTarget.classList.remove('recording');
      const lbl = document.getElementById('toggle-record-label');
      if(lbl) lbl.textContent = t('recordCall');
      await updateCallRequestDoc(r.id, { isRecording:false }).catch(()=>{});
      downloadCallRecording();
      showToast(t('recordingSaved'));
    }
  });

  if(!navigator.mediaDevices || !window.RTCPeerConnection){
    if(statusEl) statusEl.textContent = t('webrtcNotSupported');
    return;
  }

  try{
    __rtcLocalStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
      audio: true
    });
  }catch(e){
    console.error('getUserMedia (video+audio) failed', e);
    try{
      // fall back to audio-only so the call can still proceed even if the camera can't be used
      __rtcLocalStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      if(statusEl) statusEl.textContent = t('micCameraDenied');
    }catch(e2){
      console.error('getUserMedia (audio-only) also failed', e2);
      if(statusEl) statusEl.textContent = t('micCameraDenied');
      return;
    }
  }
  if(localVideo) localVideo.srcObject = __rtcLocalStream;

  const config = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]};
  __rtcPC = new RTCPeerConnection(config);
  __rtcLocalStream.getTracks().forEach(track => __rtcPC.addTrack(track, __rtcLocalStream));

  const remoteStream = new MediaStream();
  if(remoteVideo) remoteVideo.srcObject = remoteStream;
  __rtcPC.ontrack = (event) => {
    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
  };

  const roomRef = db.collection('callRequests').doc(r.id);
  const isCoach = state.role === 'coach';
  const myCandidatesCol = roomRef.collection(isCoach ? 'calleeCandidates' : 'callerCandidates');
  const theirCandidatesCol = roomRef.collection(isCoach ? 'callerCandidates' : 'calleeCandidates');

  __rtcPC.onicecandidate = (event) => {
    if(event.candidate){
      myCandidatesCol.add(event.candidate.toJSON()).catch(err=>console.error('failed to add ice candidate', err));
    }
  };

  try{
    const roomSnap = await roomRef.get();
    const roomData = roomSnap.data() || {};

    if(!roomData.offer){
      const offerDesc = await __rtcPC.createOffer();
      await __rtcPC.setLocalDescription(offerDesc);
      await roomRef.update({ offer: { type: offerDesc.type, sdp: offerDesc.sdp } });
    } else {
      await __rtcPC.setRemoteDescription(new RTCSessionDescription(roomData.offer));
      const answerDesc = await __rtcPC.createAnswer();
      await __rtcPC.setLocalDescription(answerDesc);
      await roomRef.update({ answer: { type: answerDesc.type, sdp: answerDesc.sdp } });
    }
  }catch(e){ console.error('offer/answer exchange failed', e); }

  __rtcRoomUnsub = roomRef.onSnapshot(async (snap)=>{
    const data = snap.data();
    if(!data) return;
    if(!__rtcPC.currentRemoteDescription && data.answer && __rtcPC.signalingState!=='stable'){
      try{ await __rtcPC.setRemoteDescription(new RTCSessionDescription(data.answer)); }
      catch(e){ console.error('setRemoteDescription(answer) failed', e); }
    }
    if(data.extendedMinutes!=null) r.extendedMinutes = data.extendedMinutes;
    const recIndicator = document.getElementById('recording-indicator');
    if(recIndicator) recIndicator.style.display = data.isRecording ? 'flex' : 'none';
    if(data.status==='cancelled' || data.status==='completed'){
      handleRemoteHangup(t('callEndedByOther'));
    }
  });

  __rtcCandidatesUnsub = theirCandidatesCol.onSnapshot((snap)=>{
    snap.docChanges().forEach((change)=>{
      if(change.type==='added'){
        __rtcPC.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(err=>console.error('addIceCandidate failed', err));
      }
    });
  });

  let __peerWasConnected = false;
  __rtcPC.onconnectionstatechange = ()=>{
    if(!__rtcPC) return;
    const st = __rtcPC.connectionState;
    if(statusEl){
      if(st==='connected') statusEl.textContent = '';
      else if(st==='connecting') statusEl.textContent = t('connectingCall');
    }
    if(st==='connected'){ __peerWasConnected = true; return; }
    // the peer went away without writing to the call doc (tab closed, crash, network drop)
    if(!__peerWasConnected) return;
    if(st==='failed' || st==='closed'){
      handleRemoteHangup(t('callConnectionLost'));
    } else if(st==='disconnected'){
      const idAtDrop = __rtcActiveCallId;
      setTimeout(()=>{
        if(__rtcActiveCallId===idAtDrop && __rtcPC && __rtcPC.connectionState!=='connected'){
          handleRemoteHangup(t('callConnectionLost'));
        }
      }, 8000);
    }
  };

  const startMs = r.confirmedSlot ? r.confirmedSlot.dateTimeMs : Date.now();
  const timerEl = document.getElementById('call-timer');
  function updateTimer(){
    const totalSeconds = ((r.durationMinutes||30) + (r.extendedMinutes||0)) * 60;
    const elapsed = Math.floor((Date.now() - startMs) / 1000);
    const remaining = Math.max(0, totalSeconds - elapsed);
    const mm = String(Math.floor(remaining/60)).padStart(2,'0');
    const ss = String(remaining%60).padStart(2,'0');
    if(timerEl) timerEl.textContent = `${mm}:${ss}`;
    if(remaining<=0 && statusEl && !statusEl.textContent) statusEl.textContent = t('callTimeUp');
  }
  updateTimer();
  __rtcTimerInterval = setInterval(updateTimer, 1000);
}
function startCallRecording(){
  const localVideo = document.getElementById('local-video');
  const remoteVideo = document.getElementById('remote-video');
  if(!localVideo || !remoteVideo) return false;
  if(typeof MediaRecorder === 'undefined') { showToast(t('recordingNotSupported')); return false; }

  const canvas = document.createElement('canvas');
  canvas.width = 1280; canvas.height = 720;
  const ctx = canvas.getContext('2d');

  function drawFrame(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(remoteVideo.videoWidth) ctx.drawImage(remoteVideo, 0, 0, canvas.width, canvas.height);
    if(localVideo.videoWidth){
      const pipW = 220, pipH = 300;
      ctx.drawImage(localVideo, canvas.width-pipW-24, canvas.height-pipH-24, pipW, pipH);
    }
    __rtcRecordAnimFrame = requestAnimationFrame(drawFrame);
  }
  drawFrame();

  const canvasStream = canvas.captureStream(30);

  try{
    __rtcAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dest = __rtcAudioCtx.createMediaStreamDestination();
    if(__rtcLocalStream && __rtcLocalStream.getAudioTracks().length){
      __rtcAudioCtx.createMediaStreamSource(new MediaStream(__rtcLocalStream.getAudioTracks())).connect(dest);
    }
    if(remoteVideo.srcObject && remoteVideo.srcObject.getAudioTracks && remoteVideo.srcObject.getAudioTracks().length){
      __rtcAudioCtx.createMediaStreamSource(new MediaStream(remoteVideo.srcObject.getAudioTracks())).connect(dest);
    }
    var combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  }catch(e){
    console.error('audio mixing failed, recording video only', e);
    var combinedStream = canvasStream;
  }

  __rtcRecordedChunks = [];
  try{
    __rtcRecorder = new MediaRecorder(combinedStream, { mimeType:'video/webm;codecs=vp8,opus' });
  }catch(e){
    __rtcRecorder = new MediaRecorder(combinedStream);
  }
  __rtcRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) __rtcRecordedChunks.push(e.data); };
  __rtcRecorder.start(1000);
  __rtcIsRecording = true;
  return true;
}
function stopCallRecording(){
  if(__rtcRecordAnimFrame){ cancelAnimationFrame(__rtcRecordAnimFrame); __rtcRecordAnimFrame = null; }
  if(__rtcRecorder && __rtcRecorder.state!=='inactive'){ try{ __rtcRecorder.stop(); }catch(e){} }
  if(__rtcAudioCtx){ __rtcAudioCtx.close().catch(()=>{}); __rtcAudioCtx = null; }
  __rtcIsRecording = false;
}
function downloadCallRecording(){
  if(!__rtcRecordedChunks.length){ showToast(t('noRecordingYet')); return; }
  const blob = new Blob(__rtcRecordedChunks, {type:'video/webm'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `anzclip-call-${Date.now()}.webm`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}
function teardownVideoCall(){
  if(__rtcIsRecording) stopCallRecording();
  if(__rtcTimerInterval){ clearInterval(__rtcTimerInterval); __rtcTimerInterval = null; }
  if(__rtcRoomUnsub){ __rtcRoomUnsub(); __rtcRoomUnsub = null; }
  if(__rtcCandidatesUnsub){ __rtcCandidatesUnsub(); __rtcCandidatesUnsub = null; }
  if(__rtcPC){ try{ __rtcPC.close(); }catch(e){} __rtcPC = null; }
  if(__rtcLocalStream){ __rtcLocalStream.getTracks().forEach(tr=>tr.stop()); __rtcLocalStream = null; }
  __rtcActiveCallId = null;
}
function handleRemoteHangup(msg){
  if(!__rtcActiveCallId) return; // already torn down
  const endedId = __rtcActiveCallId;
  if(__rtcIsRecording){ stopCallRecording(); downloadCallRecording(); }
  teardownVideoCall();
  setCallStatusLocally(endedId, 'completed');
  if(msg) showToast(msg);
  if(state.view==='video-call') go('call-request-detail');
}
function endVideoCall(){
  const r = state.viewingCallRequest;
  if(__rtcIsRecording){ stopCallRecording(); downloadCallRecording(); }
  teardownVideoCall();
  // tell the other side the call is over, so their screen closes too
  if(r && r.status!=='completed' && r.status!=='cancelled'){
    setCallStatusLocally(r.id, 'completed');
    updateCallRequestDoc(r.id, { status:'completed', isRecording:false }).catch(()=>{});
  }
}

function initPublicStatsCharts(){
  if(typeof Chart==='undefined') return;
  const p = state.viewingPlayer;
  if(!p || p.statsPublic===false) return;
  const role = p.playerRole || 'field';
  const defs = STAT_DEFS[role] || STAT_DEFS.field;
  const games = state.playerPublicGames || [];
  const labels = games.map((g,i)=> `${t('perGameLabel')} ${i+1}`);
  defs.forEach(s=>{
    const canvas = document.getElementById('pubstatchart-'+s.key);
    if(!canvas) return;
    let data;
    if(s.type==='ratio'){
      data = games.map(g=>{
        const v = g.stats && g.stats[s.key];
        if(!v || !v.att) return null;
        return Math.round((v.made/v.att)*100);
      });
    } else {
      data = games.map(g=> (g.stats && g.stats[s.key]!=null) ? g.stats[s.key] : null);
    }
    new Chart(canvas, {
      type: s.type==='ratio' ? 'line' : 'bar',
      data:{ labels, datasets:[{
        data,
        borderColor:'#C6FF4D', backgroundColor: s.type==='ratio' ? 'rgba(198,255,77,.18)' : '#C6FF4D',
        borderWidth:2, pointRadius:4, pointBackgroundColor:'#C6FF4D',
        fill: s.type==='ratio', tension:0.3,
        borderRadius: s.type!=='ratio' ? 4 : 0, maxBarThickness:28
      }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{
          y: s.type==='ratio'
            ? { min:0, max:100, ticks:{color:'#9aa89e', callback:(v)=>v+'%'}, grid:{color:'rgba(154,168,158,.15)'} }
            : { beginAtZero:true, ticks:{color:'#9aa89e'}, grid:{color:'rgba(154,168,158,.15)'} },
          x: { ticks:{color:'#9aa89e'}, grid:{display:false} }
        }
      }
    });
  });
}

function isCallOver(r){
  if(!r || !r.confirmedSlot) return false;
  const totalMin = (r.durationMinutes||30) + (r.extendedMinutes||0);
  return Date.now() > (r.confirmedSlot.dateTimeMs + totalMin*60*1000);
}
function setCallStatusLocally(id, status){
  if(state.viewingCallRequest && state.viewingCallRequest.id===id) state.viewingCallRequest.status = status;
  const inList = (state.callRequests||[]).find(c=>c.id===id);
  if(inList) inList.status = status;
}
function isCallJoinable(r){
  if(!r.confirmedSlot) return false;
  const now = Date.now();
  const start = r.confirmedSlot.dateTimeMs;
  const totalMin = (r.durationMinutes||30) + (r.extendedMinutes||0);
  return now >= (start - 10*60*1000) && now <= (start + totalMin*60*1000);
}

async function shareContent(title, text, url){
  const payload = url ? { title, text, url } : { title, text };
  try{
    if(navigator.share){
      await navigator.share(payload);
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return; // user cancelled the native share sheet
  }
  try{
    await navigator.clipboard.writeText(url ? `${text}\n${url}` : text);
    showToast(t('shareCopied'));
  }catch(e){
    console.error('share fallback failed', e);
    showToast(t('shareFailed'));
  }
}
function buildStatsShareText(statsArray, defs, playerName){
  const summary = computeStatSummary(statsArray, defs);
  const lines = summary.map(s=>`${s.label}: ${s.display}${s.sub?` (${s.sub})`:''}`);
  return `📊 ${t('shareStatsTitle')}${playerName?` - ${playerName}`:''}\n\n${lines.join('\n')}`;
}
async function loadImageEl(src){
  return new Promise((resolve)=>{
    if(!src){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = src;
  });
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
async function drawShareCard({ name, subtitle, photo, initials, avatarColor, ratingLine, lines, charts, linkLine, maxCharts }){
  const W = 1080;
  const headerH = ratingLine ? 730 : 670;
  // 4-up stat tiles, 3-up charts: compact without making the graphs unreadable
  const COLS = 4;
  const CHART_COLS = 3;
  const rowH = 78;
  const chartBlockH = 214; // label + chart + spacing
  const footerH = linkLine ? 175 : 110;
  const linesArr = lines||[];
  const chartsArr = (charts||[]).slice(0, maxCharts==null ? 6 : maxCharts);
  const lineRows = Math.ceil(linesArr.length/COLS);
  const chartRows = Math.ceil(chartsArr.length/CHART_COLS);
  const linesH = lineRows ? lineRows*rowH + 20 : 0;
  const chartsH = chartRows ? chartRows*chartBlockH : 0;
  let H = headerH + linesH + chartsH + footerH;
  const MAX_H = 8000; // generous safety net - actual mobile/desktop canvas limits are much higher than this
  H = Math.min(H, MAX_H);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  try{
    await Promise.all([
      document.fonts.load('800 64px Rubik'),
      document.fonts.load('700 40px Rubik'),
      document.fonts.load('500 34px Heebo'),
      document.fonts.load('600 30px "IBM Plex Mono"')
    ]);
  }catch(e){}

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0B0D09'); grad.addColorStop(1,'#181B14');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(198,255,77,.08)';
  ctx.beginPath(); ctx.ellipse(W/2, -80, 620, 260, 0, 0, Math.PI*2); ctx.fill();

  // brand
  ctx.fillStyle = '#C6FF4D';
  roundRect(ctx, 70, 64, 56, 56, 12); ctx.fill();
  ctx.fillStyle = '#F4F7EE'; ctx.font = '900 30px Rubik'; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.fillText('A', 98, 96);
  ctx.textAlign = 'left';
  ctx.font = '800 34px Rubik'; ctx.fillStyle = '#F4F7EE';
  ctx.fillText('AnzClip', 146, 96);

  // avatar
  const avR = 130, avCX = W/2, avCY = 320;
  ctx.save();
  ctx.beginPath(); ctx.arc(avCX, avCY, avR, 0, Math.PI*2); ctx.closePath(); ctx.clip();
  const img = await loadImageEl(photo);
  if(img){
    ctx.drawImage(img, avCX-avR, avCY-avR, avR*2, avR*2);
  } else {
    ctx.fillStyle = avatarColor || '#0B6E4F';
    ctx.fillRect(avCX-avR, avCY-avR, avR*2, avR*2);
    ctx.fillStyle = '#F4F7EE'; ctx.font = '800 100px Rubik'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(initials||'', avCX, avCY+8);
  }
  ctx.restore();
  ctx.strokeStyle = '#C6FF4D'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(avCX, avCY, avR, 0, Math.PI*2); ctx.stroke();

  // name + subtitle
  ctx.fillStyle = '#F4F7EE'; ctx.font = '800 64px Rubik'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText(name||'', W/2, 530);
  ctx.fillStyle = '#B9C2AC'; ctx.font = '500 34px Heebo';
  ctx.fillText(subtitle||'', W/2, 580);

  if(ratingLine){
    ctx.fillStyle = '#C6FF4D'; ctx.font = '700 40px "IBM Plex Mono"';
    ctx.fillText(ratingLine, W/2, 645);
  }

  let y = headerH;

  // stat rows (text) - 2-column grid
  const colGap = 14;
  const gridW = 980;
  const rowW = (gridW-colGap*(COLS-1))/COLS, rowX0 = (W-gridW)/2;
  linesArr.forEach((line,i)=>{
    const col = i%COLS, row = Math.floor(i/COLS);
    const rx = rowX0 + col*(rowW+colGap), ry = headerH + row*rowH;
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    roundRect(ctx, rx, ry, rowW, rowH-12, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(243,241,231,.1)'; ctx.lineWidth=1.5; roundRect(ctx, rx, ry, rowW, rowH-12, 12); ctx.stroke();
    ctx.fillStyle = '#B9C2AC'; ctx.font = '500 17px Heebo'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText(line.label.length>17 ? line.label.slice(0,16)+'…' : line.label, rx+14, ry+28);
    ctx.fillStyle = '#F4F7EE'; ctx.font = '700 24px "IBM Plex Mono"'; ctx.textAlign='left';
    ctx.fillText(line.value, rx+14, ry+56);
  });
  y = headerH + linesH;

  // embedded chart images (real rendered graphs, copied from the on-screen canvases) - 2-column grid
  const chartW = (gridW-colGap*(CHART_COLS-1))/CHART_COLS, chartX0 = (W-gridW)/2;
  chartsArr.forEach((chart,i)=>{
    const col = i%CHART_COLS, row = Math.floor(i/CHART_COLS);
    const chartX = chartX0 + col*(chartW+colGap);
    const rowY = y + row*chartBlockH;
    ctx.fillStyle = '#F4F7EE'; ctx.font = '700 22px Rubik'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText(chart.label.length>18 ? chart.label.slice(0,17)+'…' : chart.label, chartX, rowY+22);
    const boxY = rowY+36, chartH = 160;
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    roundRect(ctx, chartX, boxY, chartW, chartH, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(243,241,231,.1)'; ctx.lineWidth=1.5; roundRect(ctx, chartX, boxY, chartW, chartH, 14); ctx.stroke();
    if(chart.canvasEl && chart.canvasEl.width>0){
      const pad = 10;
      ctx.save();
      roundRect(ctx, chartX, boxY, chartW, chartH, 14); ctx.clip();
      ctx.drawImage(chart.canvasEl, chartX+pad, boxY+pad, chartW-pad*2, chartH-pad*2);
      ctx.restore();
    }
  });

  if(linkLine){
    ctx.fillStyle = '#B9C2AC'; ctx.font = '500 24px Heebo'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(linkLine.label, W/2, H-118);
    ctx.fillStyle = '#C6FF4D'; ctx.font = '600 26px "IBM Plex Mono"';
    const url = linkLine.url.length>52 ? linkLine.url.slice(0,51)+'…' : linkLine.url;
    ctx.fillText(url, W/2, H-80);
  }
  ctx.fillStyle = '#7E8A73'; ctx.font = '500 26px Heebo'; ctx.textAlign='center';
  ctx.fillText('anzclip.com', W/2, H-40);

  return new Promise(resolve=>canvas.toBlob(blob=>resolve(blob), 'image/png', 0.95));
}
function toBrandedUrl(firebaseUrl){
  try{
    const marker = '/o/';
    const idx = firebaseUrl.indexOf(marker);
    if(idx === -1) return firebaseUrl;
    const tail = firebaseUrl.slice(idx + marker.length); // encodedPath?alt=media&token=...
    return `https://anzclip.com/media/${tail}`;
  }catch(e){ return firebaseUrl; }
}
async function shareVideoClip(title, text, videoUrl){
  // Tier 1: fetch the actual video and share it as a real file attachment (best case - mobile)
  if(navigator.canShare){
    try{
      showToast(t('preparingClip'));
      const resp = await fetch(videoUrl);
      const blob = await resp.blob();
      const mime = blob.type || 'video/mp4';
      const ext = mime.includes('webm') ? 'webm' : mime.includes('quicktime') ? 'mov' : 'mp4';
      const file = new File([blob], `anzclip-clip.${ext}`, {type: mime});
      if(navigator.canShare({ files:[file] })){
        await navigator.share({ title, text, files:[file] });
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return;
      console.error('video file share failed, falling back to link', e);
    }
  }
  const brandedUrl = toBrandedUrl(videoUrl);
  // Tier 2: native URL-share (broader browser support than file-share)
  if(navigator.share){
    try{
      await navigator.share({ title, text, url: brandedUrl });
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
      console.error('url share failed, falling back to platform menu', e);
    }
  }
  // Tier 3: in-app platform picker (WhatsApp/Facebook/etc) - mainly for desktop
  showSharePlatformMenu(title, text, brandedUrl, null, 'video');
}
async function shareCardAsImage(title, text, cardConfig){
  let blob = null;
  try{ blob = await drawShareCard(cardConfig); }catch(e){ console.error('failed to draw share card', e); }
  if(!blob){ await shareContent(title, text); return; }

  // Tier 1: native OS share sheet WITH the image file attached (best case - mainly Android/iOS)
  if(navigator.canShare){
    try{
      const file = new File([blob], 'anzclip-profile.png', {type:'image/png'});
      if(navigator.canShare({ files:[file] })){
        await navigator.share({ title, text, files:[file] });
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return;
      console.error('image file share failed, falling back', e);
    }
  }

  // Tier 2 + 3 need a real public URL for the image, so upload it once
  const file = new File([blob], `anzclip-share-${Date.now()}.png`, {type:'image/png'});
  const rawImageUrl = await uploadFileToStorage(file, 'shares');
  const imageUrl = rawImageUrl ? toBrandedUrl(rawImageUrl) : null;

  if(imageUrl && navigator.share){
    try{
      await navigator.share({ title, text, url: imageUrl });
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
      console.error('url share failed, falling back to platform menu', e);
    }
  }

  if(imageUrl){
    showSharePlatformMenu(title, text, imageUrl, blob);
    return;
  }

  // last resort: download the image directly
  const localUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = localUrl; a.download = 'anzclip-profile.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(localUrl), 8000);
  showToast(t('imageSavedNote'));
}

function computeStatSummary(statsArray, defs){
  return defs.map(s=>{
    let totalMade = 0, totalAtt = 0, sum = 0, gamesCount = 0;
    statsArray.forEach(st=>{
      const v = st && st[s.key];
      if(v==null) return;
      gamesCount++;
      if(s.type==='ratio'){
        if(v.att){ totalMade += Number(v.made)||0; totalAtt += Number(v.att)||0; }
      } else {
        sum += Number(v)||0;
      }
    });
    if(!gamesCount) return null;
    let display, sub;
    if(s.type==='ratio'){
      if(!totalAtt) return null;
      const pct = Math.round((totalMade/totalAtt)*100);
      display = `${pct}%`;
      sub = `${totalMade}/${totalAtt}`;
    } else if(s.type==='decimal'){
      display = sum.toFixed(2);
      sub = `${gamesCount} ${t('gamesUnit')}`;
    } else {
      display = String(sum);
      sub = `${gamesCount} ${t('gamesUnit')}`;
    }
    return { key:s.key, label:s[state.lang], category:s.category, display, sub, gamesCount };
  }).filter(Boolean);
}
function statSummaryCardHtml(statsArray, defs){
  const summary = computeStatSummary(statsArray, defs);

    <div class="stat-category-label">${STAT_CATEGORY_LABEL[state.lang][cat]}</div>

      `).join('')}

  `).join('');
}

        const v = g.stats && g.stats[s.key];
        if(!v || !v.att) return null;
        return Math.round((v.made/v.att)*100);

function timeLeftStr(deadline){
  const diff = new Date(deadline).getTime() - Date.now();
  if(diff<=0) return '00:00:00';
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function navItemsForRole(){
  if(state.role==='admin' || state.view==='viewer-pending') return [];
  if(state.role==='viewer'){
    return [
      { action:'nav-viewer-home', iconName:'home', label:t('myProfile'), active:state.view==='viewer-home' },
    ];
  }
  if(state.role==='coach'){
    const newCount = state.requests.filter(r=>r.status==='requested').length;
    const newCallCount = (state.callRequests||[]).filter(c=>c.coachSeen===false).length;
    return [
      { action:'nav-coach-dash', iconName:'list', label:t('navIncoming'), active:state.view==='coach-dash', badge:newCount+newCallCount },
      { action:'nav-search', iconName:'search', label:t('searchTitle'), active:state.view==='search' },
    ];
  }
  const unseenCount = state.requests.filter(r=>r.gkSeen===false).length;
  const unseenCallCount = (state.callRequests||[]).filter(c=>c.gkSeen===false).length;
  return [
    { action:'nav-home', iconName:'home', label:t('navHome'), active:state.view==='home' },
    { action:'nav-requests', iconName:'list', label:t('navRequests'), active:state.view==='requests', badge:unseenCount+unseenCallCount },
    { action:'nav-search', iconName:'search', label:t('searchTitle'), active:state.view==='search' },
    { action:'nav-my-stats', iconName:'chart', label:t('myStatsNav'), active:state.view==='my-stats' },
    { action:'nav-my-clips', iconName:'clip', label:t('myClipsNav'), active:state.view==='my-clips' },
  ];
}
function renderBottomNav(){
  const items = navItemsForRole();
  if(!items.length) return '';
  return `
    <div class="bottom-nav">

function renderView(){
  switch(state.view){
    case 'lang-select': return renderLangSelect();
    case 'country-select': return renderCountrySelect();
    case 'sport-select': return renderSportSelect();
    case 'auth': return renderAuth();
    case 'auth-professional': return renderAuthProfessional();
    case 'login': return renderLogin();
    case 'signup-gk': return renderSignupGK();
    case 'signup-coach': return renderSignupCoach();
    case 'signup-mental': return renderSignupMental();
    case 'signup-viewer': return renderSignupViewer();
    case 'home': return state.role==='coach' ? renderCoachHome() : renderHome();
    case 'upload': return renderUpload();
    case 'coaches': return renderCoaches();
    case 'confirm': return renderConfirm();
    case 'requests': return renderRequests();
    case 'coach-dash': return renderCoachDash();
    case 'income': return renderIncome();
    case 'search': return renderSearch();
    case 'coach-compose': return renderCoachCompose();
    case 'profile': return renderProfile();
    case 'coach-profile': return renderCoachProfile();
    case 'admin': return renderAdmin();
    case 'my-stats': return renderMyStats();
    case 'my-clips': return renderMyClips();
    case 'player-profile': return renderPlayerProfile();
    case 'directory-players': return renderDirectoryPlayers();
    case 'viewer-home': return renderViewerHome();
    case 'contact-profile': return renderContactProfile();
    case 'request-call': return renderRequestCall();
    case 'call-request-detail': return renderCallRequestDetail();
    case 'propose-times': return renderProposeTimes();
    case 'video-call': return renderVideoCall();
    case 'viewer-pending': return renderViewerPending();
    case 'verify-email': return renderVerifyEmail();
    case 'forgot-password': return renderForgotPassword();
    default: return renderHome();
  }
}

/* ---------------- ONBOARDING ---------------- */
function renderLangSelect(){
  const langs = [
    {code:'he', flag:'🇮🇱', name:'עברית', sub:'Hebrew'},
    {code:'en', flag:'🇬🇧', name:'English', sub:'English'},
  ];
  return `

function renderSportSelect(){
  return `
    <div class="onboard">
      <div class="onboard-top">
        <button class="onboard-back" data-onb-back="lang-select">${icon('back',15)} ${t('onbBack')}</button>
        <div class="onboard-progress"><div class="done"></div><div class="done"></div></div>
        <h2>${t('onbSportTitle')}</h2>
        <p class="sub">${t('onbSportSub')}</p>
        <div class="sport-grid">
          ${SPORTS.map(sp=>`
            <div class="sport-option ${state.sport===sp?'active':''}" data-sport="${sp}"
                 style="background-image:url('/sport-${sp}.jpg')">
              <b>${SPORT_LABEL[state.lang][sp]}</b>
            </div>
          `).join('')}
        </div>
        <div class="photo-hint" style="margin-top:14px">${t('sportFixedNote')}</div>
      </div>
      <button class="btn btn-primary btn-block" data-action="onb-sport-next">${t('onbNext')}</button>
    </div>
  `;
}

/* ---------------- SIGNUP: GOALKEEPER ---------------- */
function renderSignupGK(){
  const d = state.signupDraft;
  return `
    <div class="onboard" style="padding-top:30px">      <div class="onboard-top">
        <button class="back-btn" data-action="back-to-auth" style="margin-bottom:18px">${icon('back',18)} ${t('back')}</button>
        <h2>${t('registerGKTitle')}</h2>
        <p class="sub">${t('registerGKSub')}</p>

        <label class="avatar-upload" for="photo-input">
          ${d.photo ? `<img src="${d.photo}">` : icon('ghost',30)}
        </label>
        <input type="file" id="photo-input" accept="image/*">
        <div class="photo-hint">${t('photoHint')}</div>

        <div class="field-label" style="margin-top:0">${t('fieldFullName')}</div>
        <input class="form-input" id="su-name" type="text" value="${d.name||''}">

        <div class="field-label">${t('fieldEmail')}</div>
        <input class="form-input" id="su-email" type="email" value="${d.email||''}" autocomplete="email">

        <div class="field-label">${t('fieldPassword')}</div>
        <div class="password-field">
          <input class="form-input" id="su-password" type="password" value="${d.password||''}" autocomplete="new-password">
          <button type="button" class="password-toggle" data-toggle-password="su-password">${icon('eye',18)}</button>
        </div>
        <div class="photo-hint" style="margin-top:6px;margin-bottom:0">${t('passwordHint')}</div>

        ${sportHasGoalkeeper() ? `
        <div class="field-label">${t('playerRoleTitle')}</div>
        <div class="chip-row" id="su-player-role-chips">
          <div class="chip ${d.playerRole==='goalkeeper'?'active':''}" data-su-player-role="goalkeeper">${t('playerRoleGK')}</div>
          <div class="chip ${d.playerRole==='field'?'active':''}" data-su-player-role="field">${t('playerRoleField')}</div>
        </div>
        <div class="photo-hint" style="margin-top:6px;margin-bottom:0">${t('playerRoleHint')}</div>
        ` : ''}

        ${(d.playerRole==='field' || !sportHasGoalkeeper()) ? `
          <div class="field-label">${t('fieldPositions')}</div>
          <div class="chip-row" id="su-position-chips">
            ${sportFieldPositions().map(p=>`
              <div class="chip ${(d.positions||[]).includes(p)?'active':''}" data-su-position="${p}">${POSITION_LABEL[state.lang][p]}</div>

function homeStatsCardsHtml(){
  const u = state.user;
  if(!u) return '';
  const role = u.playerRole || 'field';
  const defs = STAT_DEFS[role] || STAT_DEFS.field;
  const statsArr = state.requests.map(r=>r.stats).filter(Boolean);
  const gamesCount = statsArr.length;
  const summary = computeStatSummary(statsArr, defs).slice(0,4);
  if(!summary.length && !gamesCount) return '';
  const icons = ['target','goal','glove','trending'];
  return `
    <div class="section-title">${t('statsPageTitle')}</div>
    <div class="section-line"></div>
    <div class="icon-stats-row">
      ${gamesCount ? `
        <div class="icon-stat-card">
          ${icon('timer',22)}
          <b class="mono">${gamesCount}</b>
          <span>${t('gamesAnalyzedLabel')}</span>
        </div>
      ` : ''}
      ${summary.map((s,i)=>`
        <div class="icon-stat-card">
          ${icon(icons[i%icons.length],22)}
          <b class="mono">${s.display}</b>
          <span>${s.label}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------------- COACHES ---------------- */
function filteredCoaches(){
  let list = COACHES.filter(c => state.filters.specialty==='all' || c.specialties.includes(state.filters.specialty));
  list = list.filter(c => state.filters.country==='all' || c.country===state.filters.country);
  list = list.filter(c => state.filters.coachType==='all' || (c.coachTypes||[]).includes(state.filters.coachType));
  list = list.filter(c => state.filters.generalSpec==='all' || (c.generalSpecialties||[]).includes(state.filters.generalSpec));
  if(state.user && state.user.role==='gk' && state.user.playerRole){
    if(state.user.playerRole==='goalkeeper'){
      list = list.filter(c => (c.coachTypes||[]).includes('goalkeeper') || (c.coachTypes||[]).includes('analyst') || (c.coachTypes||[]).includes('mental'));
    } else {
      list = list.filter(c => (c.coachTypes||[]).includes('general') || (c.coachTypes||[]).includes('analyst') || (c.coachTypes||[]).includes('mental'));
    }
  }
  if(state.filters.query && state.filters.query.trim()){
    const q = state.filters.query.trim().toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q));
  }
  const sortFns = {
    rating: (a,b)=>(b.rating||0)-(a.rating||0),
    price: (a,b)=>a.singleGamePrice-b.singleGamePrice,
    years: (a,b)=>b.years-a.years,
    speed: (a,b)=>a.turnaround-b.turnaround,
  };
  return list.sort(sortFns[state.filters.sort]);
}

function countryFlag(code){ return (COUNTRIES.find(c=>c.code===code)||{}).flag || ''; }
function countryName(code){ const c = COUNTRIES.find(x=>x.code===code); return c ? (state.lang==='he'?c.he:c.en) : ''; }
function avatarHtml(c, sizePx){
  const initials = c.name.split(' ').map(n=>n[0]).join('');
  const sizeStyle = sizePx ? `width:${sizePx}px;height:${sizePx}px;font-size:${Math.round(sizePx*0.34)}px;` : '';
  if(c.photo) return `<img class="avatar" style="${sizeStyle}object-fit:cover;" src="${c.photo}">`;
  return `<div class="avatar" style="${sizeStyle}background:${c.avatarColor}">${initials}</div>`;
}
function personAvatarHtml(name, photo, sizePx){
  const initials = (name||'?').split(' ').map(n=>n[0]).join('');
  const sizeStyle = sizePx ? `width:${sizePx}px;height:${sizePx}px;font-size:${Math.round(sizePx*0.34)}px;` : '';
  if(photo) return `<img class="avatar" style="${sizeStyle}object-fit:cover;" src="${photo}">`;
  return `<div class="avatar" style="${sizeStyle}background:var(--coral)">${initials}</div>`;
}
function starsHtml(n, size){
  let out = '';
  for(let i=1;i<=5;i++){
    out += `<span style="color:${i<=n?'var(--gold)':'var(--muted)'}; opacity:${i<=n?1:0.35}; display:inline-flex;">${icon('star',size||16)}</span>`;
  }
  return `<span style="display:inline-flex; gap:2px; align-items:center; direction:ltr;">${out}</span>`;
}
function videosViewHtml(r){
  if(r.isDemo || !r.videos || !r.videos.length){
    return `<div class="video-preview" style="display:flex;align-items:center;justify-content:center;min-height:100px;background:var(--surface-2)">${icon('clip',26)}</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:10px">${r.videos.map(v=>`<div class="video-preview"><video src="${v.url}" controls></video></div>`).join('')}</div>`;
}
function statsViewHtml(stats, role){
  if(!stats || !Object.keys(stats).length) return '';
  const defs = STAT_DEFS[role] || STAT_DEFS.field;
  const categories = [...new Set(defs.map(s=>s.category))];
  const sections = categories.map(cat=>{
    const rows = defs.filter(s=>s.category===cat && stats[s.key]!=null).map(s=>{
      const v = stats[s.key];
      let display;
      if(s.type==='ratio'){
        if(v.made==null || v.att==null || v.att===0) return '';
        display = `${Math.round((v.made/v.att)*100)}%`;
      } else if(s.type==='decimal'){
        display = Number(v).toFixed(2);
      } else {
        display = String(v);
      }
      return `<div class="summary-row"><span>${s[state.lang]}</span><span class="mono">${display}</span></div>`;
    }).join('');
    if(!rows) return '';
    return `<div class="field-label" style="margin-top:14px">${STAT_CATEGORY_LABEL[state.lang][cat]}</div><div class="summary-card">${rows}</div>`;
  }).join('');
  if(!sections) return '';
  return `
    <div class="section-title" style="margin-top:18px">${t('statsTitle')}</div>
    <div class="section-line"></div>
    ${sections}
  `;
}
function attachmentsViewHtml(attachments){
  if(!attachments || !attachments.length) return '';
  return `
    <div class="field-label" style="margin-top:14px">${t('attachmentsTitle')}</div>
    <div class="attach-view-list">
      ${attachments.map(a=>{
        const isImg = a.type && a.type.startsWith('image/');
        return `
          <a class="attach-view-item" href="${a.url}" target="_blank" rel="noopener">
            ${isImg ? `<img src="${a.url}">` : `<span class="attach-icon">${icon('file',18)}</span>`}
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.name}</span>
          </a>
        `;
      }).join('')}
    </div>
  `;
}
function fmtDateTime(ts){
  const d = new Date(ts);
  const locale = state.lang==='he' ? 'he-IL' : 'en-GB';
  const datePart = d.toLocaleDateString(locale);
  const timePart = d.toLocaleTimeString(locale, {hour:'2-digit', minute:'2-digit'});
  return `${datePart} · ${timePart}`;
}

function renderConfirm(){
  const c = state.selectedCoach;
  const d = state.draft;
  if(!c) return renderCoaches();
  const dur = draftTotalDurationSec();
  const orderType = c.highlightClipEnabled ? (d.orderType || 'analysis') : 'analysis';
  const wantsClip = orderType!=='analysis' && c.highlightClipEnabled;
  const clipOnly = orderType==='clip';
  const clipPrice = c.highlightClipEnabled ? c.highlightClipPrice : 0;
  const fileLabel = d.isDemo ? d.fileName : (d.videos && d.videos.length ? `${d.videos.length} ${t('selectedVideos')}` : t('sumDash'));
  const activePackages = state.activePackages || [];
  const choice = d.paymentChoice || 'single';

  let baseLabel = t('singleGameOption'), basePrice = c.singleGamePrice, isExisting = false;
  if(choice.startsWith('existing:')){
    const pid = choice.slice(9);
    const pkg = activePackages.find(p=>p.id===pid);
    if(pkg){ baseLabel = `${t('useFromPackage')} (${pkg.gamesTotal-pkg.gamesUsed} ${t('gamesRemaining')})`; basePrice = 0; isExisting = true; }
  } else if(choice.startsWith('new:')){
    const pid = choice.slice(4);
    const pkg = (c.packages||[]).find(p=>p.id===pid);
    if(pkg){ baseLabel = `${t('packageNamePreview')} ${pkg.gameCount} ${t('gamesUnit')}`; basePrice = pkg.price; }
  }
  if(clipOnly){ basePrice = 0; isExisting = false; }
  const coachAmount = basePrice + (wantsClip ? clipPrice : 0);
  const fee = computeFee(coachAmount);

  return `
    <div class="summary-card">
      <div class="coach-top" style="margin-bottom:8px">
        ${avatarHtml(c, 48)}
        <div>
          <div class="coach-name">${c.name} ${countryFlag(c.country)}</div>
          <div class="coach-sub">${state.lang==='he'?c.tag:c.tag_en}</div>
        </div>
      </div>
      <div class="summary-row"><span>${t('sumCategory')}</span><span>${SPEC_LABEL[state.lang][d.category]}</span></div>
      <div class="summary-row"><span>${t('sumFile')}</span><span>${fileLabel}</span></div>
      <div class="summary-row"><span>${t('totalDuration')}</span><span>${dur!=null ? fmtMinutes(dur/60) : t('sumDash')}</span></div>
      <div class="summary-row"><span>${t('sumNote')}</span><span>${d.note ? d.note.slice(0,28)+(d.note.length>28?'…':'') : t('sumNone')}</span></div>
    </div>

    <div class="summary-card" style="margin-top:14px">
      ${!clipOnly ? `<div class="summary-row"><span>${t('priceForYourVideo')}</span><span class="mono">${baseLabel}${!isExisting?` - ₪${basePrice}`:''}</span></div>` : ''}
      ${wantsClip ? `<div class="summary-row"><span>${t('highlightClipTitle')}</span><span class="mono">${clipOnly?'':'+'}₪${clipPrice}</span></div>` : ''}
      ${!isExisting ? `<div class="summary-row"><span>${t('serviceFeeLabel')}</span><span class="mono">+₪${fee.fee}</span></div>` : ''}
      <div class="summary-row"><span><b>${t('totalPriceLabel')}</b></span><span class="mono"><b>₪${isExisting?0:fee.total}</b></span></div>
      <div class="summary-row"><span>${t('sumDelivery')}</span><span>${t('deliveryUpTo')} ${fmtHours(c.turnaround)}</span></div>
      ${wantsClip ? `<div class="summary-row"><span>${t('highlightClipTurnaroundLabel')}</span><span>${t('clipDeliveryUpTo')} ${fmtHours(c.highlightClipTurnaround)}</span></div>` : ''}
    </div>
    ${c.highlightClipEnabled ? `

      <div class="chip-row">
        <div class="chip ${orderType==='analysis'?'active':''}" data-order-type="analysis">${t('orderAnalysis')}</div>

      ${clipOnly ? `<div class="req-meta" style="margin-top:6px">${t('clipOnlyNote')}</div>` : ''}

function renderIncome(){
  const reqs = state.requests || [];
  const calls = state.callRequests || [];
  const types = (state.user && state.user.coachTypes) || [];
  const isMental = types.includes('mental');
  const doesAnalysis = types.length===0 || types.some(ct=>ct!=='mental');
  const amt = r => (r.price!=null ? r.price : (r.basePrice||0));

  const analysisDoneList = reqs.filter(r=>r.status==='done');
  const analysisOpenList = reqs.filter(r=>r.status==='pending' || r.status==='progress');
  const callsDoneList = calls.filter(c=>c.status==='completed');
  const callsOpenList = calls.filter(c=>c.status==='confirmed');

  const analysisEarned  = analysisDoneList.reduce((s,r)=>s+amt(r),0);
  const analysisUpcoming= analysisOpenList.reduce((s,r)=>s+amt(r),0);
  const callsEarned     = callsDoneList.reduce((s,c)=>s+(c.price||0),0);
  const callsUpcoming   = callsOpenList.reduce((s,c)=>s+(c.price||0),0);
  const totalEarned     = analysisEarned + callsEarned;
  const totalUpcoming   = analysisUpcoming + callsUpcoming;

  if(!totalEarned && !totalUpcoming){
    return `<div class="empty-state" style="padding:50px 20px">${icon('chart',34)}<b>${t('noIncomeYet')}</b></div>`;
  }
  return `

      <div class="stat-chip"><b class="mono">₪${totalEarned}</b><span>${t('incomeTotalEarned')}</span></div>

      </div>
      ${analysisOpenList.length ? `
        <div class="field-label" style="margin-top:0">${t('incomeUpcomingList')}</div>
        ${analysisOpenList.map(r=>`
          <div class="req-card" style="margin-bottom:8px">

      <div class="summary-card" style="margin-bottom:12px">

              <div class="req-meta">${fmtDateTime(r.createdAt)}</div>

                  <div class="analysis-box" style="margin-top:10px">

function renderAttachList(){
  const container = document.getElementById('attach-list');
  if(!container) return;
  container.innerHTML = state.composeAttachments.map((file, i)=>{
    const isImg = file.type && file.type.startsWith('image/');
    const thumbOrIcon = isImg
      ? `<img class="attach-thumb" src="${URL.createObjectURL(file)}">`
      : `<span class="attach-icon">${icon('file',20)}</span>`;
    return `
      <div class="attach-chip">
        ${thumbOrIcon}
        <span class="attach-name">${file.name}</span>
        <button type="button" data-remove-attach="${i}" title="${t('removeAttachment')}">${icon('x',16)}</button>
      </div>
    `;
  }).join('');
  container.querySelectorAll('[data-remove-attach]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.removeAttach, 10);
      state.composeAttachments.splice(idx, 1);
      renderAttachList();
    });
  });
}

      <input class="form-input" id="pf-new-pw" type="password" autocomplete="new-password">
