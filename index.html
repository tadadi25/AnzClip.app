}

/* ---------------- EVENT HANDLERS ---------------- */
function attachHandlers(){
  const app = document.getElementById('app');

  // password show/hide toggles
  app.querySelectorAll('[data-toggle-password]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = app.querySelector('#'+btn.dataset.togglePassword);
      if(!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = icon(showing ? 'eye' : 'eyeOff', 18);
    });
  });

  app.querySelector('[data-action="back"]')?.addEventListener('click', ()=>{
    if(state.view==='confirm') go('upload');
    else if(state.view==='upload') go('coach-profile');
    else if(state.view==='income') go(state.role==='coach' ? 'coach-dash' : 'home');
    else if(state.view==='coach-profile' && state.isSelfViewingProfile) go(state.role==='coach' ? 'coach-dash' : 'home');
    else if(state.view==='coach-profile') go(state.role==='viewer' ? 'viewer-home' : 'coaches');
    else if(state.view==='coaches') go('home');
    else if(state.view==='coach-compose') go('coach-dash');
    else if(state.view==='player-profile') go(state.role==='viewer' ? 'viewer-home' : (state.role==='coach' ? 'coach-dash' : 'home'));
    else if(state.view==='contact-profile') go('viewer-home');
    else if(state.view==='directory-players') go('viewer-home');
    else if(state.view==='profile' && state.role==='viewer') go('viewer-home');
    else if(state.view==='profile' && state.role==='coach') go('coach-dash');
    else go('home');
  });
  app.querySelectorAll('[data-action="nav-home"]').forEach(el=>{
    el.addEventListener('click', ()=>go('home'));
  });
  app.querySelectorAll('[data-action="nav-requests"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(state.user) await loadMyRequests(state.user.uid);
      go('requests');
      markSeenForRequestsTab();
      render();
    });
  });
  app.querySelectorAll('[data-action="nav-my-stats"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(state.user) await loadMyRequests(state.user.uid);
      go('my-stats');
    });
  });
  app.querySelectorAll('[data-action="nav-my-clips"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(state.user) await loadMyRequests(state.user.uid);
      go('my-clips');
    });
  });
  app.querySelector('[data-action="show-more-reviews"]')?.addEventListener('click', ()=>{
    state.reviewsExpanded = true;
    render();
  });
  app.querySelectorAll('[data-action="nav-search"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!COACHES.length) await refreshCoachDirectory();
      if(!state.allPlayers.length) state.allPlayers = await loadAllPlayers();
      if(!state.allAgents.length) state.allAgents = await loadViewerDirectory('agent');
      if(!state.allScouts.length) state.allScouts = await loadViewerDirectory('scout');
      go('search');
    });
  });
  app.querySelectorAll('[data-action="nav-viewer-home"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!COACHES.length) await refreshCoachDirectory();
      if(!state.allPlayers.length) state.allPlayers = await loadAllPlayers();
      if(!state.allAgents.length) state.allAgents = await loadViewerDirectory('agent');
      if(!state.allScouts.length) state.allScouts = await loadViewerDirectory('scout');
      go('viewer-home');
    });
  });
  app.querySelector('#unified-search-input')?.addEventListener('input', (e)=>{
    state.filters.unifiedQuery = e.target.value;
    const caret = e.target.selectionStart;
    render();
    const input = document.getElementById('unified-search-input');
    if(input){ input.focus(); input.setSelectionRange(caret, caret); }
  });
  app.querySelectorAll('[data-adv-position]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.advancedSearch.position = el.dataset.advPosition;
      const relevant = relevantStatDefsForPosition(state.advancedSearch.position);
      const relevantIds = relevant.map(s=>s.id);
      state.advancedSearch.statFilters.forEach(f=>{
        if(!relevantIds.includes(f.id)) f.id = relevant[0].id;
      });
      render();
    });
  });
  app.querySelector('[data-add-stat-filter]')?.addEventListener('click', ()=>{
    const relevant = relevantStatDefsForPosition(state.advancedSearch.position);
    state.advancedSearch.statFilters.push({ id: relevant[0].id, minValue:'' });
    render();
  });
  app.querySelectorAll('#adv-stat-filters [data-stat-filter-field]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input', (e)=>{
      const row = e.target.closest('[data-stat-filter-index]');
      const idx = parseInt(row.dataset.statFilterIndex, 10);
      const field = e.target.dataset.statFilterField;
      state.advancedSearch.statFilters[idx][field] = e.target.value;
    });
  });
  app.querySelectorAll('[data-remove-stat-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.advancedSearch.statFilters.splice(parseInt(el.dataset.removeStatFilter,10), 1);
      render();
    });
  });
  app.querySelector('[data-action="run-advanced-search"]')?.addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const validFilters = state.advancedSearch.statFilters
      .filter(f=>f.minValue!=null && f.minValue!=='')
      .map(f=>{
        const [role, key] = f.id.split(':');
        return { role, key, minValue:Number(f.minValue) };
      });
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = '...';
    state.advancedSearch.results = await searchPlayersByCriteria(state.advancedSearch.position, validFilters);
    btn.disabled = false;
    btn.textContent = originalLabel;
    render();
  });
  app.querySelectorAll('[data-search-result]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [type, uid] = el.dataset.searchResult.split(':');
      if(type==='coach'){
        const coach = COACHES.find(c=>c.id===uid);
        if(!coach) return;
        state.viewingCoach = coach;
        state.selectedCoach = coach;
        state.isSelfViewingProfile = false;
        state.draft.wantsHighlightClip = false;
        state.draft.orderType = 'analysis';
        state.draft.paymentChoice = null;
        state.reviewsExpanded = false;
        state.coachReviews = await loadCoachReviews(coach.id);
        state.coachClips = await loadCoachClips(coach.id);
        go('coach-profile');
      } else if(type==='player'){
        const player = await loadPlayerProfile(uid);
        if(!player) return;
        state.viewingPlayer = player;
        if(player.statsPublic!==false){
          state.playerPublicGames = await loadPlayerPublicStats(uid);
          state.playerPublicClips = await loadPlayerPublicClips(uid);
        } else {
          state.playerPublicGames = [];
          state.playerPublicClips = [];
        }
        go('player-profile');
      } else if(type==='agent' || type==='scout'){
        const source = type==='agent' ? state.allAgents : state.allScouts;
        const contact = (source||[]).find(p=>p.uid===uid);
        if(!contact) return;
        state.viewingContact = contact;
        go('contact-profile');
      }
    });
  });
  app.querySelector('#player-search-input')?.addEventListener('input', (e)=>{
    state.filters.playerQuery = e.target.value;
    const caret = e.target.selectionStart;
    render();
    const input = document.getElementById('player-search-input');
    if(input){ input.focus(); input.setSelectionRange(caret, caret); }
  });
  app.querySelectorAll('[data-directory-cat]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const cat = el.dataset.directoryCat;
      state.filters.directoryCategory = cat;
      if(cat==='players' && !state.allPlayers.length) state.allPlayers = await loadAllPlayers();
      if(cat==='agents' && !state.allAgents.length) state.allAgents = await loadViewerDirectory('agent');
      if(cat==='scouts' && !state.allScouts.length) state.allScouts = await loadViewerDirectory('scout');
      render();
    });
  });
  app.querySelectorAll('[data-view-contact]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const uid = el.dataset.viewContact;
      const cat = state.filters.directoryCategory;
      const source = cat==='agents' ? state.allAgents : state.allScouts;
      const contact = (source||[]).find(p=>p.uid===uid);
      if(!contact) return;
      state.viewingContact = contact;
      go('contact-profile');
    });
  });
  app.querySelectorAll('[data-action="nav-coach-dash"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(state.user) await loadIncomingRequests(state.user.uid);
      if(state.user) await loadIncomingCallRequests(state.user.uid);
      go('coach-dash');
      markCallRequestsSeen();
      render();
    });
  });
  app.querySelector('[data-action="open-onboarding"]')?.addEventListener('click', ()=>{
    state.onboardingReturnView = state.view;
    go('lang-select');
  });

  // onboarding: language
  app.querySelectorAll('[data-lang]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.lang = el.dataset.lang; render(); });
  });
  app.querySelector('[data-action="toggle-onboard-lang"]')?.addEventListener('click', ()=>{
    state.lang = state.lang==='he' ? 'en' : 'he';
    render();
  });
  app.querySelector('[data-action="onb-to-country"]')?.addEventListener('click', async ()=>{
    if(state.user){
      await savePrefs();
      go(state.onboardingReturnView || 'home');
    } else {
      go('sport-select');
    }
  });
  app.querySelectorAll('[data-onb-back]').forEach(el=>{
    el.addEventListener('click', ()=>go(el.dataset.onbBack));
  });
  app.querySelectorAll('[data-sport]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.sport = el.dataset.sport; render(); });
  });
  app.querySelector('[data-action="onb-sport-next"]')?.addEventListener('click', async ()=>{
    await savePrefs();
    go('auth');
  });
  app.querySelectorAll('[data-country]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.countryFilter = el.dataset.country; render(); });
  });
  app.querySelector('[data-action="onb-finish"]')?.addEventListener('click', async ()=>{
    state.filters.country = state.countryFilter;
    await savePrefs();
    go(state.onboardingReturnView || 'home');
  });

  // auth
  app.querySelectorAll('[data-action="goto-signup-gk"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.signupRole = 'gk'; state.signupDraft = {}; go('signup-gk');
    });
  });
  app.querySelector('[data-action="goto-signup-coach"]')?.addEventListener('click', ()=>{
    state.signupRole = 'coach'; state.signupDraft = { specialties:[] }; go('signup-coach');
  });
  app.querySelector('[data-action="goto-signup-mental"]')?.addEventListener('click', ()=>{
    state.signupRole = 'coach'; state.signupDraft = { coachTypes:['mental'], mentalPackages:[] }; go('signup-mental');
  });
  app.querySelector('[data-action="goto-signup-agent"]')?.addEventListener('click', ()=>{
    state.signupRole = 'agent'; state.signupDraft = { viewerRole:'agent' }; go('signup-viewer');
  });
  app.querySelector('[data-action="goto-signup-scout"]')?.addEventListener('click', ()=>{
    state.signupRole = 'scout'; state.signupDraft = { viewerRole:'scout' }; go('signup-viewer');
  });
  app.querySelector('[data-action="goto-auth-professional"]')?.addEventListener('click', ()=>{
    go('auth-professional');
  });
  app.querySelector('[data-action="goto-auth-main"]')?.addEventListener('click', ()=>{
    go('auth');
  });
  app.querySelectorAll('[data-action="back-to-auth"]').forEach(el=>{
    el.addEventListener('click', ()=>go('auth'));
  });
  app.querySelector('[data-action="goto-login"]')?.addEventListener('click', ()=>{
    state.signupDraft = {}; go('login');
  });
  app.querySelector('#login-email')?.addEventListener('input', (e)=>{ state.signupDraft.loginEmail = e.target.value; });
  app.querySelector('#login-password')?.addEventListener('input', (e)=>{ state.signupDraft.loginPassword = e.target.value; });
  app.querySelector('[data-action="submit-login"]')?.addEventListener('click', async ()=>{
    const email = (state.signupDraft.loginEmail||'').trim().toLowerCase();
    const password = state.signupDraft.loginPassword||'';
    const res = await firebaseLogin(email, password);
    if(res.ok){
      state.user = {uid:res.uid, ...res.profile};
      if(state.user.role==='admin'){
        state.role = 'admin';
        if(!res.emailVerified){
          state.postVerifyDestination = 'admin';
          go('verify-email');
          return;
        }
        state.adminPendingCoaches = await loadPendingCoaches();
        state.adminStats = await loadAdminStats();
        showToast(t('welcomeBack')+', Admin');
        go('admin');
        return;
      }
      state.role = (state.user.role==='agent'||state.user.role==='scout') ? 'viewer' : (state.user.role==='coach' ? 'coach' : 'player');
      if(!res.emailVerified){
        state.postVerifyDestination = 'home';
        go('verify-email');
        return;
      }
      if(state.role==='viewer'){
        if(!state.user.isVerified){ go('viewer-pending'); return; }
        await refreshCoachDirectory();
        state.allPlayers = await loadAllPlayers();
        showToast(t('welcomeBack')+', '+state.user.name);
        go('viewer-home');
        return;
      }
      if(state.role==='coach'){
        await refreshCoachDirectory();
        state.coachId = state.user.uid;
        state.coachReviews = await loadCoachReviews(state.user.uid);
        await loadIncomingRequests(state.user.uid);
        await loadIncomingCallRequests(state.user.uid);
      } else {
        await loadMyRequests(state.user.uid);
        await loadMyCallRequests(state.user.uid);
        await refreshCoachDirectory();
      }
      showToast(t('welcomeBack')+', '+state.user.name);
      await savePrefs();
      go(state.role==='coach' ? 'coach-dash' : 'home');
    } else {
      state.user = null;
      showToast(t(res.errorKey));
    }
  });
  app.querySelector('[data-action="goto-forgot-password"]')?.addEventListener('click', ()=>{
    go('forgot-password');
  });
  app.querySelector('#reset-email')?.addEventListener('input', (e)=>{ state.signupDraft.resetEmail = e.target.value; });
  app.querySelector('[data-action="send-reset-link"]')?.addEventListener('click', async ()=>{
    const email = (state.signupDraft.resetEmail||'').trim().toLowerCase();
    if(!EMAIL_RE.test(email)){ showToast(t('invalidEmail')); return; }
    await sendPasswordReset(email);
    showToast(t('resetLinkSent'));
    go('login');
  });
  app.querySelector('[data-action="resend-verification"]')?.addEventListener('click', async ()=>{
    const ok = await resendVerificationEmail();
    if(ok) showToast(t('verificationResent'));
    else showToast(t('saveError'));
  });
  app.querySelector('[data-action="check-verified"]')?.addEventListener('click', async ()=>{
    const verified = await refreshEmailVerified();
    if(!verified){ showToast(t('stillNotVerified')); return; }
    const dest = state.postVerifyDestination || 'home';
    if(state.role==='admin'){
      state.adminPendingCoaches = await loadPendingCoaches();
      state.adminStats = await loadAdminStats();
      go('admin');
      return;
    }
    if(state.role==='coach'){
      await refreshCoachDirectory();
      state.coachId = state.user.uid;
      state.coachReviews = await loadCoachReviews(state.user.uid);
      await loadIncomingRequests(state.user.uid);
      await loadIncomingCallRequests(state.user.uid);
    } else if(state.role==='viewer'){
      if(!state.user.isVerified){ go('viewer-pending'); return; }
      await refreshCoachDirectory();
      state.allPlayers = await loadAllPlayers();
      await savePrefs();
      go('viewer-home');
      return;
    } else {
      await loadMyRequests(state.user.uid);
      await loadMyCallRequests(state.user.uid);
      await refreshCoachDirectory();
    }
    await savePrefs();
    if(dest==='country-select'){
      state.onboardingReturnView = 'home';
      go('country-select');
    } else {
      go(state.role==='coach' ? 'coach-dash' : 'home');
    }
  });

  // signup: shared photo upload
  app.querySelector('#photo-input')?.addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    try{
      state.signupDraft.photo = await resizeImageFile(f);
      render();
    }catch(err){ console.error('photo read failed', err); showToast(t('photoError')); }
  });
  app.querySelector('#cert-input')?.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    state.signupDraft.certificateFile = f;
    render();
  });
  app.querySelector('#su-agree-terms')?.addEventListener('change', (e)=>{
    state.signupDraft.agreedTerms = e.target.checked;
  });
  app.querySelector('#pf-stats-public')?.addEventListener('change', (e)=>{
    state.profileDraft.statsPublic = e.target.checked;
  });

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // signup: goalkeeper
  ['su-name','su-email','su-password','su-dob','su-club','su-height','su-about'].forEach(id=>{
    app.querySelector('#'+id)?.addEventListener('input', (e)=>{
      const map = {'su-name':'name','su-email':'email','su-password':'password','su-dob':'dob','su-club':'club','su-height':'height','su-about':'about'};
      state.signupDraft[map[id]] = e.target.value;
    });
  });
  app.querySelectorAll('[data-su-position]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = el.dataset.suPosition;
      const positions = state.signupDraft.positions || [];
      state.signupDraft.positions = positions.includes(p) ? positions.filter(x=>x!==p) : [...positions, p];
      render();
    });
  });
  app.querySelectorAll('[data-su-player-role]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.signupDraft.playerRole = el.dataset.suPlayerRole;
      if(state.signupDraft.playerRole==='goalkeeper') state.signupDraft.positions = ['goalkeeper'];
      else state.signupDraft.positions = (state.signupDraft.positions||[]).filter(p=>p!=='goalkeeper');
      render();
    });
  });
  app.querySelector('[data-action="finish-signup-gk"]')?.addEventListener('click', async ()=>{
    const d = state.signupDraft;
    if(!d.name || !d.name.trim()){ showToast(t('requiredName')); return; }
    if(!EMAIL_RE.test((d.email||'').trim())){ showToast(t('invalidEmail')); return; }
    if(!d.password || d.password.length<6){ showToast(t('invalidPassword')); return; }
    if(!d.agreedTerms){ showToast(t('mustAgreeTerms')); return; }
    if(!sportHasGoalkeeper()) d.playerRole = 'field';   // basketball has no goalkeeper
    if(!d.playerRole){ showToast(t('requiredPlayerRole')); return; }
    const emailLower = d.email.trim().toLowerCase();
    const profile = {
      role:'gk', name:d.name.trim(), email:emailLower,
      sport: state.sport || 'football',
      playerRole: sportHasGoalkeeper() ? d.playerRole : 'field',
      positions: (sportHasGoalkeeper() && d.playerRole==='goalkeeper') ? ['goalkeeper'] : (d.positions || []),
      photo:d.photo||null, dob:d.dob||null, club:d.club||'', height:d.height||'', about:d.about||'',
      acceptedTermsAt: Date.now()
    };
    const res = await firebaseSignUp(emailLower, d.password, profile);
    if(!res.ok){ showToast(t(res.errorKey)); return; }
    state.user = {uid:res.uid, ...profile};
    state.role = 'player';
    state.requests = [];
    state.postVerifyDestination = 'country-select';
    go('verify-email');
  });

  // signup: coach
  ['su-name','su-email','su-password','su-years','su-single-price','su-clip-price','su-about','su-mental-price'].forEach(id=>{
    app.querySelector('#'+id)?.addEventListener('input', (e)=>{
      const map = {'su-name':'name','su-email':'email','su-password':'password','su-years':'years','su-single-price':'singleGamePrice','su-clip-price':'highlightClipPrice','su-about':'about','su-mental-price':'mentalSessionPrice'};
      state.signupDraft[map[id]] = e.target.value;
    });
  });
  app.querySelector('#su-country')?.addEventListener('change', (e)=>{ state.signupDraft.country = e.target.value; });
  app.querySelector('#su-turnaround')?.addEventListener('change', (e)=>{ state.signupDraft.turnaround = e.target.value; });
  app.querySelector('#su-clip-turnaround')?.addEventListener('change', (e)=>{ state.signupDraft.highlightClipTurnaround = e.target.value; });
  app.querySelector('#su-mental-duration')?.addEventListener('change', (e)=>{ state.signupDraft.mentalCallDuration = e.target.value; });
  app.querySelector('[data-add-package="su"]')?.addEventListener('click', ()=>{
    if(!state.signupDraft.packages) state.signupDraft.packages = [];

  });
  app.querySelectorAll('#su-packages-list [data-pkg-field]').forEach(el=>{
    el.addEventListener('input', (e)=>{

  app.querySelector('[data-action="submit-analysis"]')?.addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const r = state.requests.find(x=>x.id===state.composeId);
    if(!r) return;
    const clipOnlyOrder = reqOrderType(r)==='clip';
    const analysisText = app.querySelector('#analysis-text')?.value?.trim() || '';
    if(!clipOnlyOrder && !analysisText){ showToast(t('requiredAnalysis')); return; }
    if(clipOnlyOrder && !state.composeClipFile){ showToast(t('highlightClipUploadHint')); return; }
    const scoreVal = clipOnlyOrder ? null : parseFloat(app.querySelector('#score-range')?.value || '8.0').toFixed(1);

    const stats = {};
    app.querySelectorAll('#stats-inputs [data-stat-key]').forEach(inp=>{
      const val = inp.value.trim();
      if(val==='') return;
      const key = inp.dataset.statKey, field = inp.dataset.statField;
      if(field==='count'){ stats[key] = Number(val); }
      else {
        if(!stats[key]) stats[key] = {};
        stats[key][field] = Number(val);
      }
    });
    const statRole = r.gkPlayerRole || 'field';
    for(const key in stats){
      const v = stats[key];
      if(typeof v === 'object'){
        if(v.made==null || v.att==null){ showToast(`${statLabel(key, statRole)}: ${t('statIncompleteRatioMsg')}`); return; }
        if(v.made > v.att){ showToast(`${statLabel(key, statRole)} ${t('statInvalidRatioMsg')}`); return; }
      }
    }

    const files = state.composeAttachments || [];
    const uploadedAttachments = [];
    let failedCount = 0;
    if(files.length){
      btn.disabled = true;
      const originalLabel = btn.textContent;
      for(let i=0;i<files.length;i++){
        const f = files[i];
        btn.textContent = `${t('uploadingAttachments')} (${i+1}/${files.length}) 0%`;
        const url = await uploadFileToStorage(f, `analysis-attachments/${r.id}`, (pct)=>{
          btn.textContent = `${t('uploadingAttachments')} (${i+1}/${files.length}) ${pct}%`;
        });
        if(url) uploadedAttachments.push({ name:f.name, url, type:f.type||'' });
        else { failedCount++; console.error('attachment upload failed, skipping:', f.name); }
      }
      btn.disabled = false;
      btn.textContent = originalLabel;
    }

    let highlightClipUrl = null;
    if(r.wantsHighlightClip && state.composeClipFile){
      btn.disabled = true;
      const originalLabel = btn.textContent;
      btn.textContent = `${t('uploadingVideo')} 0%`;
      highlightClipUrl = await uploadFileToStorage(state.composeClipFile, `highlight-clips/${r.id}`, (pct)=>{
        btn.textContent = `${t('uploadingVideo')} ${pct}%`;
      });
      btn.disabled = false;
      btn.textContent = originalLabel;
    }

    // the written analysis is also saved as a standalone file the player keeps in their profile
    let reportUrl = null;
    if(!clipOnlyOrder){
      try{
        const reportHtml = buildAnalysisReportHtml({...r, attachments:uploadedAttachments}, scoreVal, analysisText, stats, r.gkPlayerRole||'field');
        const reportFile = new File([reportHtml], `anzclip-report.html`, {type:'text/html'});
        btn.disabled = true;
        const originalLabel = btn.textContent;
        btn.textContent = `${t('uploadingAttachments')} 0%`;
        reportUrl = await uploadFileToStorage(reportFile, `reports/${r.id}`, (pct)=>{
          btn.textContent = `${t('uploadingAttachments')} ${pct}%`;
        });
        btn.disabled = false;
        btn.textContent = originalLabel;
      }catch(err){ console.error('failed to build report file', err); }
    }

    const ok = await updateRequestDoc(r.id, {status:'done', score:scoreVal, analysis:analysisText, attachments:uploadedAttachments, stats, highlightClipUrl, reportUrl, gkSeen:false});
    if(!ok){ showToast(t('saveError')); return; }
    r.reportUrl = reportUrl;
    r.status = 'done';
    r.score = scoreVal;
    r.analysis = analysisText;
    r.attachments = uploadedAttachments;
    r.stats = stats;
    r.highlightClipUrl = highlightClipUrl;
    r.gkSeen = false;
    state.composeAttachments = [];
    state.composeClipFile = null;
    if(highlightClipUrl){
      try{
        await db.collection('coachClips').add({
          coachUid: r.coachUid, gkUid: r.gkUid, gkName: r.gkName||'', url: highlightClipUrl, createdAt: Date.now(), requestId: r.id
        });
      }catch(err){ console.error('failed to create public coach clip', err); }
    }
    if(Object.keys(stats).length){
      try{
        await db.collection('playerGameStats').add({
          gkUid: r.gkUid, coachUid: r.coachUid, gkPlayerRole: r.gkPlayerRole||'field', stats, createdAt: Date.now(), requestId: r.id
        });
      }catch(err){ console.error('failed to create public player stats', err); }
    }
    sendEmailNotification(
      r.gkEmail,
      `הניתוח שלכם מ-${r.coach.name} מוכן!`,
      `<div dir="rtl" style="font-family:sans-serif">
        <h2>הניתוח שלכם מוכן</h2>
        <p><b>${r.coach.name}</b> שלח/ה לכם ניתוח מלא.</p>
        <p>ציון כללי: <b>${scoreVal}/10</b></p>
        <p>היכנסו לאפליקציה כדי לקרוא את הניתוח המלא.</p>
      </div>`
    );
    showToast(failedCount>0 ? t('someAttachmentsFailed') : t('toastAnalysisSent'));
    go('coach-dash');
  });

  app.querySelectorAll('[data-home-coach-type]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.homeCoachTypeFilter = el.dataset.homeCoachType;
      render();
    });
  });

  // upload view
  app.querySelector('[data-action="pick-file"]')?.addEventListener('click', ()=>{
    app.querySelector('#file-input').click();
  });
  async function addVideoFiles(fileList){
    const files = Array.from(fileList || []);
    if(!files.length) return;
    if(!state.draft.videos) state.draft.videos = [];
    const newEntries = files.map(f=>({ file:f, name:f.name, url:URL.createObjectURL(f), durationSec:null }));
    state.draft.videos = state.draft.videos.concat(newEntries);
    render();
    for(const entry of newEntries){
      entry.durationSec = await getVideoDuration(entry.url);
      render();
    }
  }
  app.querySelector('#file-input')?.addEventListener('change', (e)=>{
    addVideoFiles(e.target.files);
    e.target.value = '';
  });
  app.querySelector('#file-input-more')?.addEventListener('change', (e)=>{
    addVideoFiles(e.target.files);
    e.target.value = '';
  });
  app.querySelectorAll('[data-remove-video]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.removeVideo, 10);
      state.draft.videos.splice(idx, 1);
      render();
    });
  });
  app.querySelector('[data-action="remove-file"]')?.addEventListener('click', ()=>{
    state.draft.isDemo=false; state.draft.fileName=null; state.draft.demoDurationSec=null;
    render();
  });
  app.querySelector('[data-action="use-demo-file"]')?.addEventListener('click', ()=>{
    state.draft.isDemo = true;
    state.draft.fileName = t('demoFileName');
    state.draft.demoDurationSec = 480;
    state.draft.videos = [];
    render();
  });
  app.querySelectorAll('#cat-chips .chip').forEach(el=>{
    el.addEventListener('click', ()=>{ state.draft.category = el.dataset.cat; render(); });
  });
  app.querySelector('#note-input')?.addEventListener('input', (e)=>{ state.draft.note = e.target.value; });
  app.querySelector('[data-action="to-coaches"]')?.addEventListener('click', async ()=>{
    const d = state.draft;
    if(!d.isDemo && (!d.videos || !d.videos.length)) return;
    if(!state.selectedCoach){ go('coaches'); return; }
    go('confirm');
  });

  // coaches view
  app.querySelector('#coach-search-input')?.addEventListener('input', (e)=>{
    state.filters.query = e.target.value;
    const caret = e.target.selectionStart;
    render();
    const input = document.getElementById('coach-search-input');
    if(input){ input.focus(); input.setSelectionRange(caret, caret); }
  });
  app.querySelectorAll('[data-coach-type-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.filters.coachType = el.dataset.coachTypeFilter; state.filters.generalSpec='all'; render(); });
  });
  app.querySelectorAll('[data-genspec-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.filters.generalSpec = el.dataset.genspecFilter; render(); });
  });
  app.querySelectorAll('[data-country-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.filters.country = el.dataset.countryFilter; render(); });
  });
  app.querySelectorAll('[data-spec]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.filters.specialty = el.dataset.spec; render(); });
  });
  app.querySelector('#sort-select')?.addEventListener('change', (e)=>{
    state.filters.sort = e.target.value; render();
  });
  app.querySelectorAll('[data-select-coach]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const coach = COACHES.find(c=>c.id===el.dataset.selectCoach) || state.viewingCoach;
      state.selectedCoach = coach;
      if(!state.draft.wantsHighlightClip) state.draft.wantsHighlightClip = false;
        state.draft.orderType = 'analysis';
      state.draft.orderType = state.draft.orderType || 'analysis';
      if(!state.activePackages || !state.activePackages.length){
        state.activePackages = state.user ? await loadActivePackages(state.user.uid, coach.id) : [];
      }
      if(!state.draft.paymentChoice){
        state.draft.paymentChoice = state.activePackages.length ? ('existing:'+state.activePackages[0].id) : 'single';
      }
      state.draft.videos = [];
      state.draft.isDemo = false;
      state.draft.fileName = null;
      state.draft.category = state.draft.category || 'kids';
      state.draft.note = '';
      go('upload');
    });
  });
  app.querySelectorAll('[data-view-coach]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const coach = COACHES.find(c=>c.id===el.dataset.viewCoach);
      if(!coach) return;
      state.viewingCoach = coach;
      state.selectedCoach = coach;
      state.isSelfViewingProfile = false;
      state.draft.wantsHighlightClip = false;
        state.draft.orderType = 'analysis';
      state.draft.paymentChoice = null;
      state.reviewsExpanded = false;
      state.coachReviews = await loadCoachReviews(coach.id);
      state.coachClips = await loadCoachClips(coach.id);
      state.activePackages = state.user ? await loadActivePackages(state.user.uid, coach.id) : [];
      state.draft.paymentChoice = state.activePackages.length ? ('existing:'+state.activePackages[0].id) : 'single';
      go('coach-profile');
    });
  });
  app.querySelectorAll('[data-view-player]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const gkUid = el.dataset.viewPlayer;
      if(!gkUid) return;
      const player = await loadPlayerProfile(gkUid);
      if(!player) return;
      state.viewingPlayer = player;
      if(player.statsPublic!==false){
        state.playerPublicGames = await loadPlayerPublicStats(gkUid);
        state.playerPublicClips = await loadPlayerPublicClips(gkUid);
      } else {
        state.playerPublicGames = [];
        state.playerPublicClips = [];
      }
      go('player-profile');
    });
  });
  app.querySelectorAll('[data-order-type]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.draft.orderType = el.dataset.orderType;
      state.draft.wantsHighlightClip = state.draft.orderType!=='analysis';
      render();
    });
  });
  app.querySelector('[data-toggle-clip]')?.addEventListener('click', ()=>{
    state.draft.wantsHighlightClip = !state.draft.wantsHighlightClip;
    render();
  });
  app.querySelectorAll('[data-payment-choice]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.draft.paymentChoice = el.dataset.paymentChoice;
      render();
    });
  });

  // confirm view
  app.querySelector('[data-action="submit-request"]')?.addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const c = state.selectedCoach, d = state.draft;
    const dur = draftTotalDurationSec();
    const choice = d.paymentChoice || 'single';
    const orderType = c.highlightClipEnabled ? (d.orderType || 'analysis') : 'analysis';
    const wantsClip = orderType!=='analysis' && c.highlightClipEnabled;
    const clipOnly = orderType==='clip';
    const clipPrice = wantsClip ? c.highlightClipPrice : 0;

    let basePrice = c.singleGamePrice, paymentType = 'single', packageTemplateId = null, existingPurchaseId = null;
    if(clipOnly){
      basePrice = 0; paymentType = 'clipOnly';
    } else if(choice.startsWith('existing:')){
      existingPurchaseId = choice.slice(9);
      basePrice = 0; paymentType = 'existingPackage';
    } else if(choice.startsWith('new:')){
      packageTemplateId = choice.slice(4);
      const pkg = (c.packages||[]).find(p=>p.id===packageTemplateId);
      basePrice = pkg ? pkg.price : 0; paymentType = 'newPackage';
    }
    const coachAmount = basePrice + clipPrice;
    const fee = computeFee(coachAmount);

    const uploadedVideos = [];
    const videosToUpload = d.videos || [];
    if(!d.isDemo && videosToUpload.length){
      btn.disabled = true;
      const originalLabel = btn.textContent;
      const track = document.getElementById('upload-progress-track');
      const fill = document.getElementById('upload-progress-fill');
      if(track) track.style.display = 'block';
      for(let i=0;i<videosToUpload.length;i++){
        const v = videosToUpload[i];
        btn.textContent = `${t('uploadingVideo')} (${i+1}/${videosToUpload.length}) 0%`;
        const url = await uploadVideoToStorage(v.file, state.user.uid, (pct)=>{
          btn.textContent = `${t('uploadingVideo')} (${i+1}/${videosToUpload.length}) ${pct}%`;
          if(fill) fill.style.width = pct + '%';
        });
        if(url) uploadedVideos.push({ name:v.name, url, durationSec:v.durationSec||null });
        if(fill) fill.style.width = '0%';
      }
      btn.disabled = false;
      btn.textContent = originalLabel;
      if(track) track.style.display = 'none';
      if(!uploadedVideos.length){ showToast(t('videoUploadError')); return; }
    }

    // handle package purchase / draw-down
    let packagePurchaseId = existingPurchaseId;
    if(paymentType==='newPackage'){
      const pkg = (c.packages||[]).find(p=>p.id===packageTemplateId);
      if(pkg){
        try{
          const ref = await db.collection('packagePurchases').add({
            gkUid: state.user.uid, gkName: state.user.name, coachUid: c.id, coachName: c.name,
            gamesTotal: pkg.gameCount, gamesUsed: 1, packagePrice: pkg.price, purchasedAt: Date.now()
          });
          packagePurchaseId = ref.id;
        }catch(err){ console.error('failed to create package purchase', err); }
      }
    } else if(paymentType==='existingPackage' && existingPurchaseId){
      try{
        await db.collection('packagePurchases').doc(existingPurchaseId).update({
          gamesUsed: firebase.firestore.FieldValue.increment(1)
        });
      }catch(err){ console.error('failed to update package usage', err); }
    }

    const reqData = {
      gkUid: state.user.uid, gkName: state.user.name, gkPhoto: state.user.photo||null, gkEmail: state.user.email||null, gkSeen: true,
      gkPlayerRole: state.user.playerRole || 'field',
      coachUid: c.id,
      coach: { id:c.id, name:c.name, country:c.country, turnaround:c.turnaround, avatarColor:c.avatarColor, photo:c.photo||null },
      category: d.category, note: d.note||'', fileName: d.isDemo ? d.fileName : `${uploadedVideos.length} ${t('selectedVideos')}`,
      isDemo: !!d.isDemo,
      videos: uploadedVideos,
      totalDurationSec: dur,
      paymentType, packagePurchaseId, basePrice, orderType, wantsHighlightClip: wantsClip, highlightClipPrice: clipPrice, highlightClipTurnaround: wantsClip ? c.highlightClipTurnaround : null,
      price: coachAmount, platformFee: fee.fee, totalCharged: fee.total,
      createdAt: Date.now(), deadline: null, status:'requested'
    };
    const id = await createRequestDoc(reqData);
    if(!id){ showToast(t('saveError')); return; }
    state.requests.push({ id, ...reqData });
    if(paymentType==='newPackage') showToast(t('packagePurchased'));
    sendEmailNotification(
      c.email,
      `בקשת ניתוח חדשה מ-${state.user.name}`,
      `<div dir="rtl" style="font-family:sans-serif">
        <h2>יש לכם בקשת ניתוח חדשה!</h2>
        <p><b>${state.user.name}</b> שלח/ה בקשה לניתוח וידאו.</p>
        <p>קטגוריה: ${SPEC_LABEL[state.lang][d.category]}<br>סכום: ₪${fee.total}</p>
        <p>היכנסו לאפליקציה כדי לאשר או לדחות את הבקשה.</p>
      </div>`
    );
    showToast(t('toastSent'));
    go('requests');
  });

  // requests view - demo complete
  app.querySelectorAll('[data-demo-complete]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const req = state.requests.find(r=>r.id===el.dataset.demoComplete);
      if(!req) return;
      const score = (Math.random()*1.5+7.5).toFixed(1);
      const analysis = SAMPLE_ANALYSIS[state.lang];
      const ok = await updateRequestDoc(req.id, {status:'done', score, analysis});
      if(!ok){ showToast(t('saveError')); return; }
      req.status = 'done';
      req.score = score;
      req.analysis = analysis;
      showToast(t('toastAnalysisRcvd'));
      render();
    });
  });

  // requests view - rate the coach after analysis
  app.querySelectorAll('[data-rate-req]').forEach(wrap=>{
    const stars = Array.from(wrap.querySelectorAll('[data-rate-star]'));
    const paint = (n)=> stars.forEach((s,i)=>{ s.style.color = (i < n) ? 'var(--gold)' : 'var(--muted)'; });
    const selected = parseInt(wrap.dataset.selected||'0', 10);
    paint(selected);
    stars.forEach((s,i)=>{
      s.addEventListener('mouseenter', ()=> paint(i+1));
      s.addEventListener('click', ()=>{
        wrap.dataset.selected = s.dataset.rateStar;
        paint(parseInt(s.dataset.rateStar,10));
      });
    });
    wrap.addEventListener('mouseleave', ()=> paint(parseInt(wrap.dataset.selected||'0',10)));
  });
  app.querySelectorAll('[data-submit-rating]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const reqId = btn.dataset.submitRating;
      const req = state.requests.find(r=>r.id===reqId);
      if(!req) return;
      const wrap = app.querySelector(`[data-rate-req="${reqId}"]`);
      const n = parseInt(wrap?.dataset.selected||'0', 10);
      if(!n){ showToast(t('requiredAnalysis')); return; }
      const reviewText = app.querySelector(`#review-text-${reqId}`)?.value?.trim() || '';
      const result = await rateCoachRequest(reqId, req.coachUid, n, reviewText, state.user.uid, state.user.name, state.user.photo);
      if(!result.reqOk){ showToast(t('saveError')); return; }
      req.gkRating = n;
      req.reviewText = reviewText;
      showToast(t('ratingSaved'));
      if(!result.coachOk) console.warn('Rating saved on the request, but updating the coach\'s aggregate rating failed (check Firestore rules for the users collection).');
      render();
    });
  });
  app.querySelectorAll('[data-submit-call-rating]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const callId = btn.dataset.submitCallRating;
      const call = state.viewingCallRequest && state.viewingCallRequest.id===callId ? state.viewingCallRequest : (state.callRequests||[]).find(c=>c.id===callId);
      if(!call) return;
      const wrap = app.querySelector(`[data-rate-req="${callId}"]`);
      const n = parseInt(wrap?.dataset.selected||'0', 10);
      if(!n){ showToast(t('requiredAnalysis')); return; }
      const reviewText = app.querySelector(`#review-text-${callId}`)?.value?.trim() || '';
      const result = await rateCallRequest(callId, call.coachUid, n, reviewText, state.user.uid, state.user.name, state.user.photo);
      if(!result.reqOk){ showToast(t('saveError')); return; }
      call.gkRating = n;
      call.reviewText = reviewText;
      if(state.viewingCallRequest) state.viewingCallRequest = call;
      showToast(t('ratingSaved'));
      render();
    });
  });

  if(state.view==='my-stats') initStatsCharts();
  if(state.view==='player-profile') initPublicStatsCharts();
  if(state.view==='video-call') initVideoCall();
  else teardownVideoCall();
}

/* countdown ticker */
setInterval(()=>{
  if(state.view!=='requests' && state.view!=='coach-dash') return;
  document.querySelectorAll('[data-countdown]').forEach(el=>{
    el.textContent = timeLeftStr(el.dataset.countdown);
  });
}, 1000);

/* ---------------- INIT ---------------- */
(async function init(){
  await loadPrefs();
  const fbUser = await waitForAuthUser();
  if(fbUser){
    try{
      const doc = await db.collection('users').doc(fbUser.uid).get();
      if(doc.exists){
        state.user = {uid:fbUser.uid, ...doc.data()};
        state.role = (state.user.role==='agent'||state.user.role==='scout') ? 'viewer' : (state.user.role==='coach' ? 'coach' : 'player');
        if(!fbUser.emailVerified){
          state.postVerifyDestination = 'home';
          state.view = 'verify-email';
        } else if(state.role==='viewer'){
          if(state.user.isVerified){ await refreshCoachDirectory(); state.allPlayers = await loadAllPlayers(); }
          state.view = state.user.isVerified ? 'viewer-home' : 'viewer-pending';
        } else if(state.role==='coach'){
          await refreshCoachDirectory();
          state.coachId = state.user.uid;
          state.coachReviews = await loadCoachReviews(state.user.uid);
          await loadIncomingRequests(state.user.uid);
          await loadIncomingCallRequests(state.user.uid);
          state.view = 'coach-dash';
        } else {
          await loadMyRequests(state.user.uid);
          await loadMyCallRequests(state.user.uid);
          await refreshCoachDirectory();
          state.view = 'home';
        }
      } else if(fbUser.email && fbUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
        state.user = {uid:fbUser.uid, email:fbUser.email, role:'admin'};
        state.role = 'admin';
        if(!fbUser.emailVerified){
          state.postVerifyDestination = 'admin';
          state.view = 'verify-email';
        } else {
          state.adminPendingCoaches = await loadPendingCoaches();
          state.adminStats = await loadAdminStats();
          state.view = 'admin';
        }
      } else {
        state.view = 'lang-select';
      }
    }catch(e){
      console.error('failed to restore session', e);
      state.view = 'lang-select';
    }
  } else {
    // Language selection is always the first screen for anyone not already logged in,
    // even if a language was chosen in a previous visit.
    state.view = 'lang-select';
  }
  // a shared profile link (anzclip.com/?coach=UID) opens straight on that profile
  try{
    const sharedCoachId = new URLSearchParams(location.search).get('coach');
    if(sharedCoachId && state.user && state.view!=='verify-email'){
      if(!COACHES.length) await refreshCoachDirectory();
      const shared = COACHES.find(x=>x.id===sharedCoachId);
      if(shared){
        state.viewingCoach = shared;
        state.selectedCoach = shared;
        state.isSelfViewingProfile = state.user.uid===sharedCoachId;
        state.reviewsExpanded = false;
        state.coachReviews = await loadCoachReviews(shared.id);
        state.coachClips = await loadCoachClips(shared.id);
        state.view = 'coach-profile';
      }
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){ console.error('shared profile link failed', e); }
  render();
})();
</script>
</body>
</html>
